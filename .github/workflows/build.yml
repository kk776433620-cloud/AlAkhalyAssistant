name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          mkdir -p app/src/main/java/com/akhali
          mkdir -p gradle/wrapper
          echo "distributionUrl=https://services.gradle.org/distributions/gradle-7.6-bin.zip" > gradle/wrapper/gradle-wrapper.properties
          echo "include ':app'" > settings.gradle
          cat > build.gradle << 'END1'
          buildscript{ repositories{ google(); mavenCentral() }; dependencies{ classpath 'com.android.tools.build:gradle:7.4.2'; classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.20' } }
          allprojects{ repositories{ google(); mavenCentral() } }
          END1
          cat > app/build.gradle << 'END2'
          plugins{ id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android{ namespace 'com.akhali'; compileSdk 33; defaultConfig{ applicationId "com.akhali"; minSdk 21; targetSdk 33; versionCode 111; versionName "111-DEBUG" }; compileOptions{ sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }; kotlinOptions{ jvmTarget='17' } }
          dependencies{ implementation 'androidx.core:core-ktx:1.10.1' }
          END2
          cat > app/src/main/AndroidManifest.xml << 'END3'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.akhali">
            <uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.VIBRATE"/>
            <application android:label="Akhali 111"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity><service android:name=".AkhaliService" android:exported="false" android:foregroundServiceType="microphone"/></application>
          </manifest>
          END3
          cat > app/src/main/java/com/akhali/MainActivity.kt << 'END5'
          package com.akhali
          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.widget.*
          class MainActivity: Activity(){
            override fun onCreate(b:Bundle?){
              super.onCreate(b)
              val l=LinearLayout(this).apply{orientation=LinearLayout.VERTICAL; setPadding(30,30,30,30)}
              val tv=TextView(this).apply{text="أكحلي 111 - يرد على أي صوت\n\nالطريقة:\n1- اضغط تشغيل\n2- لا تقل يا أكحلي، قل: هلا\n3- أو قل: سلام\n4- أو أي كلمة عربي"; textSize=18f}
              val btn=Button(this).apply{text="شغل - بيرد على أي كلمة"}
              btn.setOnClickListener{
                requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO, Manifest.permission.POST_NOTIFICATIONS),1)
                startForegroundService(Intent(this,AkhaliService::class.java))
                Toast.makeText(this,"اشتغل! قل: هلا",Toast.LENGTH_LONG).show()
              }
              l.addView(tv); l.addView(btn); setContentView(l)
            }
          }
          END5
          cat > app/src/main/java/com/akhali/AkhaliService.kt << 'END4'
          package com.akhali
          import android.app.*
          import android.content.*
          import android.os.*
          import android.speech.*
          import android.speech.tts.TextToSpeech
          import java.util.*
          class AkhaliService: Service(), TextToSpeech.OnInitListener{
            lateinit var tts: TextToSpeech
            var sr: SpeechRecognizer?=null
            var listening=false
            override fun onCreate(){
              super.onCreate()
              tts=TextToSpeech(this,this)
              val ch=NotificationChannel("akh","Akhali",NotificationManager.IMPORTANCE_LOW)
              (getSystemService(NOTIFICATION_SERVICE) as NotificationManager).createNotificationChannel(ch)
              startForeground(1, Notification.Builder(this,"akh").setContentTitle("أكحلي 111 شغال - قل: هلا").setSmallIcon(android.R.drawable.ic_btn_speak_now).build())
            }
            override fun onInit(s:Int){ tts.language=Locale("ar"); tts.setSpeechRate(1.1f); startListening() }
            fun startListening(){
              if(listening) return
              try{
                listening=true
                sr?.destroy()
                sr=SpeechRecognizer.createSpeechRecognizer(this)
                sr?.setRecognitionListener(object: RecognitionListener{
                  override fun onResults(b:Bundle?){
                    listening=false
                    val q=b?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.get(0)?.lowercase()?: ""
                    var ans=""
                    if(q.isNotEmpty()){
                      ans = when{
                        q.contains("هلا") -> "هلا والله يا غالي، هلا"
                        q.contains("سلام") -> "وعليكم السلام ورحمة الله"
                        q.contains("كيف") -> "بخير الحمد لله، انت كيفك؟"
                        q.contains("اسمك") -> "انا أكحلي"
                        else -> "سمعتك تقول $q، هلا بك"
                      }
                      tts.speak(ans,TextToSpeech.QUEUE_FLUSH,null,null)
                    }
                    Handler(Looper.getMainLooper()).postDelayed({startListening()},800)
                  }
                  override fun onError(e:Int){
                    listening=false
                    Handler(Looper.getMainLooper()).postDelayed({startListening()},800)
                  }
                  override fun onReadyForSpeech(p:Bundle?){}
                  override fun onBeginningOfSpeech(){}
                  override fun onRmsChanged(v:Float){}
                  override fun onBufferReceived(b:ByteArray?){}
                  override fun onEndOfSpeech(){}
                  override fun onEvent(t:Int,p:Bundle?){}
                  override fun onPartialResults(p:Bundle?){}
                })
                val i=Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply{
                  putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                  putExtra(RecognizerIntent.EXTRA_LANGUAGE, "ar")
                  putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 1)
                }
                sr?.startListening(i)
              }catch(e:Exception){ listening=false; Handler(Looper.getMainLooper()).postDelayed({startListening()},1000) }
            }
            override fun onBind(i:Intent?):IBinder?=null
          }
          END4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 7.6
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Akhali-111-ANY-WORD
          path: app/build/outputs/apk/debug/*.apk
