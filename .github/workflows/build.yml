name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          mkdir -p app/src/main/java/com/akhali
          mkdir -p gradle/wrapper
          echo "distributionUrl=https://services.gradle.org/distributions/gradle-7.6-bin.zip" > gradle/wrapper/gradle-wrapper.properties
          echo "include ':app'" > settings.gradle
          cat > build.gradle << 'END1'
          buildscript{ repositories{ google(); mavenCentral() }; dependencies{ classpath 'com.android.tools.build:gradle:7.4.2'; classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.20' } }
          allprojects{ repositories{ google(); mavenCentral() } }
          END1
          cat > app/build.gradle << 'END2'
          plugins{ id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android{ namespace 'com.akhali'; compileSdk 33; defaultConfig{ applicationId "com.akhali"; minSdk 21; targetSdk 33; versionCode 116; versionName "116-ICON-FIX" }; compileOptions{ sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }; kotlinOptions{ jvmTarget='17' } }
          dependencies{ implementation 'androidx.core:core-ktx:1.10.1' }
          END2
          cat > app/src/main/AndroidManifest.xml << 'END3'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.akhali">
            <uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
            <application android:label="Akhali BG">
              <activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
              <activity android:name=".OverlayActivity" android:exported="false" android:theme="@android:style/Theme.Translucent.NoTitleBar"/>
              <service android:name=".BgService" android:exported="false" android:foregroundServiceType="microphone"/>
            </application>
          </manifest>
          END3
          cat > app/src/main/java/com/akhali/MainActivity.kt << 'END5'
          package com.akhali
          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.*
          class MainActivity: Activity(){
            override fun onCreate(b:Bundle?){
              super.onCreate(b)
              val l=LinearLayout(this).apply{orientation=LinearLayout.VERTICAL; setPadding(30,30,30,30)}
              val tv=TextView(this).apply{text="أكحلي 116 - مصلح\n\nالآن الأيقونة بتطلع!\n1- اضغط زر 1: السماح فوق التطبيقات\n2- اضغط زر 2: شغل الخلفية\n3- اطلع وقل يا أكحلي"; textSize=18f}
              val b1=Button(this).apply{text="1- السماح بالظهور فوق التطبيقات"}
              val b2=Button(this).apply{text="2- شغل وضع الخلفية"}
              b1.setOnClickListener{ startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))) }
              b2.setOnClickListener{
                requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO, Manifest.permission.POST_NOTIFICATIONS),1)
                startForegroundService(Intent(this,BgService::class.java))
                Toast.makeText(this,"اشتغل في الخلفية! اطلع وجرب",Toast.LENGTH_LONG).show()
              }
              l.addView(tv); l.addView(b1); l.addView(b2); setContentView(l)
            }
          }
          END5
          cat > app/src/main/java/com/akhali/BgService.kt << 'END6'
          package com.akhali
          import android.app.*
          import android.content.*
          import android.os.*
          import android.speech.*
          import android.speech.tts.TextToSpeech
          import java.util.*
          class BgService: Service(), TextToSpeech.OnInitListener{
            lateinit var tts: TextToSpeech
            var sr: SpeechRecognizer?=null
            var listening=false
            override fun onCreate(){
              super.onCreate()
              tts=TextToSpeech(this,this)
              val ch=NotificationChannel("akh","Akhali BG",NotificationManager.IMPORTANCE_LOW)
              (getSystemService(NOTIFICATION_SERVICE) as NotificationManager).createNotificationChannel(ch)
              startForeground(1, Notification
