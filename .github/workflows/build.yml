          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import java.util.Locale
          class BgService:Service(),TextToSpeech.OnInitListener,RecognitionListener{
            var tts:TextToSpeech?=null
            var sr:SpeechRecognizer?=null
            fun startLoop(){
              try{
                sr?.destroy()
                sr=SpeechRecognizer.createSpeechRecognizer(this)
                sr?.setRecognitionListener(this)
                val i=Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL,RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                i.putExtra(RecognizerIntent.EXTRA_LANGUAGE,"ar-YE")
                sr?.startListening(i)
              }catch(e:Exception){
                Thread{Thread.sleep(1000); startLoop()}.start()
              }
            }
            override fun onCreate(){
              super.onCreate()
              tts=TextToSpeech(this,this)
              if(Build.VERSION.SDK_INT>=26){
                val ch=NotificationChannel("akhali","الاكحلي",NotificationManager.IMPORTANCE_LOW)
                getSystemService(NotificationManager::class.java).createNotificationChannel(ch)
                val n=Notification.Builder(this,"akhali").setContentTitle("الاكحلي يسمع").setContentText("قول يا اكحلي").setSmallIcon(android.R.drawable.ic_btn_speak_now).build()
                startForeground(1,n)
              }
            }
            override fun onInit(s:Int){
              if(s==TextToSpeech.SUCCESS){
                tts?.language=Locale("ar")
                tts?.speak("انا اسمع يا اكحلي حاضر من عيوني",TextToSpeech.QUEUE_FLUSH,null,null)
                startLoop()
              }
            }
            override fun onResults(b:Bundle?){
              val s=b?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.get(0)?.lowercase()?:""
              if(s.contains("اكحلي")){
                tts?.speak("حاضر من عيوني "+s,TextToSpeech.QUEUE_FLUSH,null,null)
              }
              Thread{Thread.sleep(1000); startLoop()}.start()
            }
            override fun onError(e:Int){Thread{Thread.sleep(1000); startLoop()}.start()}
            override fun onReadyForSpeech(p:Bundle?){}
            override fun onBeginningOfSpeech(){}
            override fun onRmsChanged(r:Float){}
            override fun onBufferReceived(b:ByteArray?){}
            override fun onEndOfSpeech(){}
            override fun onPartialResults(p:Bundle?){}
            override fun onEvent(t:Int,p:Bundle?){}
            override fun onBind(i:Intent?):IBinder?=null
          }
          K5

          echo "FILES READY LINES COUNT:"
          wc -l app/src/main/java/com/akhali/*.kt
          wget -q https://services.gradle.org/distributions/gradle-7.6-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/
          chmod +x /tmp/gradle-7.6/bin/gradle
          /tmp/gradle-7.6/bin/gradle assembleDebug --no-daemon
          ls -lh app/build/outputs/apk/debug/
      - uses: actions/upload-artifact@v4
        with:
          name: APK-181-FULL-350-LINES
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
