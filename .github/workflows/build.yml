name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Rebuild Project Structure
        run: |
          mkdir -p app/src/main/java/com/alakhaly/assistant
          mkdir -p app/src/main/res/layout
          mkdir -p gradle/wrapper
          mv *.kt app/src/main/java/com/alakhaly/assistant/ 2>/dev/null || true
          [ -f "AndroidManifest.xml" ] && mv AndroidManifest.xml app/src/main/ || true
          [ -f "activity_main.xml" ] && mv activity_main.xml app/src/main/res/layout/ || true
          
          cat > build.gradle << 'GRADLE'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.4'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.10'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          GRADLE
          
          echo "include ':app'" > settings.gradle
          
          cat > app/build.gradle << 'APP'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.alakhaly.assistant'
              compileSdk 34
              defaultConfig {
                  applicationId "com.alakhaly.assistant"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          APP
          
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip" > gradle/wrapper/gradle-wrapper.properties

      - name: Setup Gradle v4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlAkhali-APK
          path: app/build/outputs/apk/debug/*.apk
