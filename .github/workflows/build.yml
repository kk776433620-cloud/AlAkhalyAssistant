              bYem.setOnClickListener{save(0.85f,0.95f,"يمني")}
              bDeep.setOnClickListener{save(0.75f,0.90f,"جهوري")}
              bNorm.setOnClickListener{save(1.0f,1.0f,"طبيعي")}
