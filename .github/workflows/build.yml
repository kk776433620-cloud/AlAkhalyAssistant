          pathlib.Path("app/src/main/java/com/akhali/BgService.kt").write_text("""
          package com.akhali
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.os.Build
          import android.os.Bundle
          import android.os.IBinder
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.telephony.SmsManager
          import java.util.Locale
          class BgService:Service(), TextToSpeech.OnInitListener, RecognitionListener{
            var tts:TextToSpeech?=null;var sr:SpeechRecognizer?=null;var pitch=1.05f;var rate=0.93f
            override fun onCreate(){
              super.onCreate()
              val sp=getSharedPreferences("ultimate",0);pitch=sp.getFloat("pitch",1.05f);rate=sp.getFloat("rate",0.93f)
              tts=TextToSpeech(this,this)
              if(Build.VERSION.SDK_INT>=26){
                val ch=NotificationChannel("akhali","الاكحلي العملاق",NotificationManager.IMPORTANCE_LOW)
                getSystemService(NotificationManager::class.java).createNotificationChannel(ch)
                val n=Notification.Builder(this,"akhali").setContentTitle("الاكحلي العملاق يسمع يا اكحلي").setContentText("قول يا اكحلي حتى والشاشة مقفلة والجوال على الشاحن - حاضر من عيوني").setSmallIcon(android.R.drawable.ic_btn_speak_now).build()
                startForeground(1,n)
              }
            }
            override fun onInit(s:Int){
              if(s==TextToSpeech.SUCCESS){
                tts?.language=Locale("ar");tts?.setPitch(pitch);tts?.setSpeechRate(rate)
                tts?.speak("حيا يا الاكحلي انا العملاق الكامل اسمع لحالي حتى لو الجوال على الشاحن والشاشة مقفلة قول يا اكحلي",TextToSpeech.QUEUE_FLUSH,null,null)
                startLoop()
              }
            }
            fun startLoop(){try{sr?.destroy();sr=SpeechRecognizer.createSpeechRecognizer(this);sr?.setRecognitionListener(this);val intent=Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL,RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE,"ar-YE");intent.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS,true);sr?.startListening(intent)}catch(e:Exception){restart()}}
            fun restart(){Thread{Thread.sleep(1000);startLoop()}.start()}
            override fun onResults(b:Bundle?){
              val said=b?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.get(0)?.lowercase()?:""
              if(said.contains("اكحلي")||said.contains("كحلي")){
                var ans="حاضر من عيوني يا الاكحلي"
                if(said.contains("رسائل")||said.contains("ارسل")){
                  ans="حاضر من عيوني برسل له انك مشغول حتى والشاشة مقفلة"
                  try{SmsManager.getDefault().sendTextMessage("777123456",null,"اني مشغول - من الاكحلي العملاق",null,null)}catch(e:Exception){}
                }else if(said.contains("ابحث")){
                  ans="حاضر من عيوني ببحث لك"
                  val i=Intent(Intent.ACTION_VIEW,android.net.Uri.parse("https://www.google.com/search?q="+said.replace("يا اكحلي","")))
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);startActivity(i)
                }else if(said.contains("اقرا")){
                  val txt=SmartControlService.instance?.readScreen()?.take(150)?: "الشاشة مقفلة"
                  ans="حاضر من عيوني في الشاشة $txt"
                }else if(said.contains("رجوع")){SmartControlService.instance?.doBack(); ans="حاضر رجعت"}
                else if(said.contains("رئيسية")){SmartControlService.instance?.doHome(); ans="حاضر رحت الرئيسية"}
                else if(said.contains("سلام")||said.contains("كيفك")) ans="حاضر من عيوني هلا يا الاكحلي انا العملاق جاهز بكل المميزات"
                else ans="حاضر من عيوني سمعتك تقول $said اش تامر يا الاكحلي؟"
                tts?.speak(ans,TextToSpeech.QUEUE_FLUSH,null,null)
              }
              restart()
            }
            override fun onError(e:Int){restart()}
            override fun onReadyForSpeech(p:Bundle?){};override fun onBeginningOfSpeech(){};override fun onRmsChanged(r:Float){};override fun onBufferReceived(b:ByteArray?){};override fun onEndOfSpeech(){};override fun onPartialResults(p:Bundle?){val s=p?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.get(0)?.lowercase()?:"";if(s.contains("اكحلي")) tts?.speak("نعم يا الاكحلي؟",TextToSpeech.QUEUE_FLUSH,null,null)};override fun onEvent(t:Int,p:Bundle?){};override fun onBind(i:Intent?):IBinder?=null;override fun onDestroy(){sr?.destroy();super.onDestroy()}
          }
          """)
