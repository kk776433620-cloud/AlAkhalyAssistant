name: إنشاء ملف APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: بناء مشروع أندرويد 9
        run: |
          rm -rf app/build
          mkdir -p app/src/main/java/com/alakhaly/assistant
          
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' version '1.8.10' }
          android {
            compileSdk 33
            defaultConfig {
              applicationId "com.alakhaly.assistant"
              minSdk 21
              targetSdk 28
              versionCode 10
              versionName "9-fixed"
            }
          }
          dependencies {
            implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.10"
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="AlAkhali">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/alakhaly/assistant/MainActivity.kt << 'EOF'
          package com.alakhaly.assistant
          import android.app.Activity
          import android.os.Bundle
          import android.widget.TextView
          class MainActivity : Activity() {
            override fun onCreate(b: Bundle?) {
              super.onCreate(b)
              val t = TextView(this)
              t.text = "AlAkhali شغال تمام على اندرويد 9"
              t.textSize = 24f
              setContentView(t)
            }
          }
          EOF

          cat > build.gradle << 'EOF'
          buildscript {
            dependencies {
              classpath "com.android.tools.build:gradle:7.4.2"
              classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.10"
            }
          }
          EOF
          cat > settings.gradle << 'EOF'
          include ':app'
          EOF
          
          gradle :app:assembleDebug --no-daemon

      - name: رفع ملف APK
        uses: actions/upload-artifact@v4
        with:
          name: AlAkhali-APK-Android9-FIXED
          path: app/build/outputs/apk/debug/app-debug.apk
