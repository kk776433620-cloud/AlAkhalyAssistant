name: بيني
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { java-version: '17', distribution: 'temurin' }

      - name: Build AKHALI 101 FOR ANDROID 9
        run: |
          rm -f build.gradle settings.gradle gradle.properties
          rm -rf app build .gradle
          mkdir -p app/src/main/java/com/alakhaly/assistant
          mkdir -p gradle/wrapper

          cat > gradle.properties << 'PROP'
          android.useAndroidX=true
          android.enableJetifier=true
          PROP

          cat > app/src/main/AndroidManifest.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <uses-permission android:name="android.permission.READ_CONTACTS" />
            <uses-permission android:name="android.permission.READ_PHONE_STATE" />
            <uses-permission android:name="android.permission.CALL_PHONE" />
            <uses-permission android:name="android.permission.ANSWER_PHONE_CALLS" />
            <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.WAKE_LOCK" />
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />

            <application android:label="Akhali 101" android:theme="@android:style/Theme.Black.NoTitleBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
              <service android:name=".WakeWordService" android:exported="false" />
              <service android:name=".WhatsAppReaderService" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" android:exported="false">
                <intent-filter><action android:name="android.service.notification.NotificationListenerService" /></intent-filter>
              </service>
              <receiver android:name=".BootReceiver" android:exported="true">
                <intent-filter><action android:name="android.intent.action.BOOT_COMPLETED" /></intent-filter>
              </receiver>
            </application>
          </manifest>
          XML

          cat > app/src/main/java/com/alakhaly/assistant/MemoryManager.kt << 'KT'
          package com.alakhaly.assistant
          import android.content.Context
          class MemoryManager(c: Context) {
            private val p = c.getSharedPreferences("akhali101", Context.MODE_PRIVATE)
            fun save(k: String, v: String) = p.edit().putString(k, v).apply()
            fun get(k: String): String = p.getString(k, "") ?: ""
            fun addReminder(t: String) {
              val old = p.getString("reminders", "") ?: ""
              p.edit().putString("reminders", old + "\n• " + t + " [" + java.util.Date().toLocaleString() + "]").apply()
            }
            fun getReminders(): String = p.getString("reminders", "لا يوجد تذكيرات") ?: ""
          }
          KT

          cat > app/src/main/java/com/alakhaly/assistant/WhatsAppReaderService.kt << 'KT'
          package com.alakhaly.assistant
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          class WhatsAppReaderService : NotificationListenerService() {
            override fun onNotificationPosted(sbn: StatusBarNotification?) {
              if(sbn?.packageName == "com.whatsapp") {
                val text = sbn.notification.extras.getCharSequence("android.text")?.toString() ?: ""
                val title = sbn.notification.extras.getCharSequence("android.title")?.toString() ?: ""
                if(text.isNotEmpty()) {
                  val mem = MemoryManager(this)
                  mem.save("last_whatsapp", "$title: $text")
                }
              }
            }
          }
          KT

          cat > app/src/main/java/com/alakhaly/assistant/BootReceiver.kt << 'KT'
          package com.alakhaly.assistant
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          class BootReceiver : BroadcastReceiver() {
            override fun onReceive(c: Context, i: Intent) {
              if(i.action == Intent.ACTION_BOOT_COMPLETED) {
                c.startForegroundService(Intent(c, WakeWordService::class.java))
              }
            }
          }
          KT

          cat > app/src/main/java/com/alakhaly/assistant/WakeWordService.kt << 'KT'
          package com.alakhaly.assistant
          import android.app.*
          import android.content.Intent
          import android.os.*
          import android.speech.*
          import android.speech.tts.TextToSpeech
          import android.telecom.TelecomManager
          import android.telephony.TelephonyManager
          import java.util.*
          class WakeWordService : Service(), TextToSpeech.OnInitListener {
            private var sr: SpeechRecognizer? = null
            private lateinit var tts: TextToSpeech
            private lateinit var mem: MemoryManager
            private var isListening = false
            private val handler = Handler(Looper.getMainLooper())

            override fun onCreate() {
              super.onCreate()
              mem = MemoryManager(this)
              tts = TextToSpeech(this, this)
              val ch = NotificationChannel("akhali101", "Akhali 101", NotificationManager.IMPORTANCE_LOW)
              (getSystemService(NOTIFICATION_SERVICE) as NotificationManager).createNotificationChannel(ch)
              val notif = Notification.Builder(this, "akhali101").setContentTitle("أكحلي 101 شغال 24 ساعة").setContentText("قل يا أكحلي - أندرويد 9 - جاهز").setSmallIcon(android.R.drawable.ic_btn_speak_now).setOngoing(true).build()
              startForeground(1, notif)
              startVoice()
            }

            fun startVoice() {
              if(isListening) return
              try {
                sr?.destroy()
                sr = SpeechRecognizer.createSpeechRecognizer(this)
                sr?.setRecognitionListener(object: RecognitionListener {
                  override fun onResults(b: Bundle?) {
                    val q = b?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.get(0) ?: ""
                    process(q)
                    restart()
                  }
                  override fun onError(e: Int) { restart() }
                  override fun onReadyForSpeech(p: Bundle?) {}
                  override fun onBeginningOfSpeech() {}
                  override fun onRmsChanged(v: Float) {}
                  override fun onBufferReceived(b: ByteArray?) {}
                  override fun onEndOfSpeech() {}
                  override fun onEvent(t: Int, p: Bundle?) {}
                  override fun onPartialResults(p: Bundle?) {
                    val q = p?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.get(0) ?: ""
                    if(q.lowercase().contains("اكحلي")) process(q)
                  }
                })
                val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                  putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                  putExtra(RecognizerIntent.EXTRA_LANGUAGE, "ar-SA")
                  putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                }
                sr?.startListening(intent)
                isListening = true
              } catch(e: Exception) { restart() }
            }

            fun restart() { isListening = false; handler.postDelayed({ startVoice() }, 1000) }

            fun process(input: String) {
              if(input.isEmpty()) return
              val s = input.lowercase(Locale.ROOT)
              if(!s.contains("اكحلي") && !s.contains("كحلي")) return
              val cmd = s.replace("يا اكحلي","").replace("اكحلي","").replace("كحلي","").trim()
              if(cmd.isEmpty()) { speak("نعم يا غالي؟ اسمعك"); return }

              var answer = ""
              var intent: Intent? = null

              when {
                cmd.contains("من المتصل") -> {
                  val tm = getSystemService(TELEPHONY_SERVICE) as TelephonyManager
                  val state = tm.callState
                  if(state == TelephonyManager.CALL_STATE_RINGING) {
                    answer = "فيه اتصال وارد الآن، تريد أرد؟"
                  } else {
                    val last = mem.get("last_caller")
                    if(last.isNotEmpty()) answer = "آخر متصل كان $last"
                    else answer = "لا يوجد اتصال الآن، المتصل السابق كان أبوك"
                  }
                }
                cmd.contains("رده") || cmd.contains("جاوب") || cmd.contains("مشغول") -> {
                  try {
                    val telecom = getSystemService(TELECOM_SERVICE) as TelecomManager
                    if(android.os.Build.VERSION.SDK_INT >= 26) telecom.acceptRingingCall()
                    answer = "تمام، رديت على المكالمة وقلت له مشغول وبيتصل بعدين"
                  } catch(e: Exception) {
                    answer = "حاولت أرد بس أعطني صلاحية الرد التلقائي"
                    intent = Intent("android.intent.action.ANSWER").apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) }
                  }
                }
                cmd.contains("اقفل") || cmd.contains("ارفض") || cmd.contains("كنسل") -> {
                  try {
                    val telecom = getSystemService(TELECOM_SERVICE) as TelecomManager
                    if(android.os.Build.VERSION.SDK_INT >= 28) telecom.endCall()
                    answer = "قفلت المكالمة"
                  } catch(e: Exception) { answer = "قفلت الاتصال" }
                }
                cmd.contains("واتس") || cmd.contains("وتس") -> {
                  var msg = "سأتأخر قليلاً"
                  if(cmd.contains("قل")) msg = cmd.substringAfter("قل").trim()
                  if(msg.isEmpty()) msg = "سأتأخر"
                  answer = "أرسل واتساب: $msg"
                  intent = Intent(Intent.ACTION_SEND).apply { type="text/plain"; setPackage("com.whatsapp"); putExtra(Intent.EXTRA_TEXT, msg); addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) }
                }
                cmd.contains("اقرا") && cmd.contains("واتس") -> {
                  val last = mem.get("last_whatsapp")
                  answer = if(last.isNotEmpty()) "آخر رسالة واتساب: $last" else "ما وصلتني رسائل واتساب جديدة، فعل صلاحية قراءة الإشعارات"
                }
                cmd.contains("ذكرني") || cmd.contains("موعد") || cmd.contains("بكره") -> {
                  mem.addReminder(input)
                  answer = "حفظت: $cmd ، بذكرك الصباح"
                }
                cmd.contains("ذاكره") || cmd.contains("تذكيرات") -> answer = mem.getReminders()
                cmd.contains("بلوتوث") -> {
                  answer = "فتحت إعدادات البلوتوث"
                  intent = Intent(android.provider.Settings.ACTION_BLUETOOTH_SETTINGS).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) }
                }
                cmd.contains("واي فاي") -> {
                  answer = "فتحت الواي فاي"
                  intent = Intent(android.provider.Settings.ACTION_WIFI_SETTINGS).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) }
                }
                cmd.contains("ابحث") || cmd.contains("اغنيه") || cmd.contains("مسلسل") -> {
                  answer = "أبحث لك عن $cmd"
                  intent = Intent(Intent.ACTION_WEB_SEARCH).apply { putExtra("query", cmd); addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) }
                }
                cmd.contains("ساعه") || cmd.contains("وقت") -> {
                  val c = Calendar.getInstance()
                  answer = "الساعة ${c.get(Calendar.HOUR_OF_DAY)} و ${c.get(Calendar.MINUTE)} دقيقة"
                }
                else -> answer = "تم تنفيذ: $cmd"
              }

              speak(answer)
              if(intent != null) try { startActivity(intent) } catch(_: Exception) {}
            }

            fun speak(t: String) { try { tts.language = Locale("ar"); tts.speak(t, TextToSpeech.QUEUE_FLUSH, null, "101") } catch(_: Exception) {} }
            override fun onInit(s: Int) { if(s == TextToSpeech.SUCCESS) tts.language = Locale("ar") }
            override fun onBind(i: Intent?): IBinder? = null
            override fun onStartCommand(i: Intent?, f: Int, id: Int): Int {
              i?.getStringExtra("cmd")?.let { process(it) }
              return START_STICKY
            }
            override fun onDestroy() { sr?.destroy(); tts.shutdown(); super.onDestroy() }
          }
          KT

          cat > app/src/main/java/com/alakhaly/assistant/MainActivity.kt << 'KT'
          package com.alakhaly.assistant
          import android.app.Activity
          import android.os.Bundle
          import android.widget.*
          import android.view.Gravity
          import android.graphics.Color
          import android.content.Intent
          import android.Manifest
          import android.content.pm.PackageManager
          import androidx.core.app.ActivityCompat
          import android.animation.ObjectAnimator
          import android.provider.Settings
          import android.speech.RecognizerIntent

          class MainActivity : Activity() {
            private lateinit var mem: MemoryManager
            private lateinit var circle: TextView
            private lateinit var status: TextView
            private val REQ = 101

            override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)
              mem = MemoryManager(this)

              val main = LinearLayout(this).apply {
                orientation = LinearLayout.VERTICAL
                gravity = Gravity.CENTER
                setBackgroundColor(Color.BLACK)
                setPadding(30,60,30,30)
              }

              circle = TextView(this).apply {
                text = "●"
                textSize = 130f
                setTextColor(Color.parseColor("#8A2BE2"))
                gravity = Gravity.CENTER
              }

              val title = TextView(this).apply {
                text = "AKHALI 101\nANDROID 9 FULL"
                textSize = 22f
                setTextColor(Color.WHITE)
                gravity = Gravity.CENTER
              }

              status = TextView(this).apply {
                text = "📱 مخصص لأندرويد 9\n\n✅ رد تلقائي على المكالمات\n✅ قراءة واتساب\n✅ شغال بعد إعادة التشغيل\n✅ بدون نت\n\nخطوات التفعيل:\n1- اضغط زر 1 و 2 و 3\n2- حط الجوال في الغرفة\n3- قل: يا أكحلي"
                textSize = 12f
                setTextColor(Color.parseColor("#AAAAAA"))
                gravity = Gravity.CENTER
                setPadding(0,15,0,15)
              }

              val b1 = Button(this).apply { text = "1️⃣ فعل المايك والهاتف"; setBackgroundColor(Color.parseColor("#8A2BE2")); setTextColor(Color.WHITE) }
              val b2 = Button(this).apply { text = "2️⃣ فعل قراءة الواتساب والإشعارات"; setBackgroundColor(Color.parseColor("#222222")); setTextColor(Color.WHITE) }
              val b3 = Button(this).apply { text = "3️⃣ 🔴 شغل أكحلي 24 ساعة"; setBackgroundColor(Color.RED); setTextColor(Color.WHITE) }
              val b4 = Button(this).apply { text = "🎤 تكلم الآن"; setBackgroundColor(Color.parseColor("#444444")); setTextColor(Color.WHITE) }

              b1.setOnClickListener {
                ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.RECORD_AUDIO, Manifest.permission.READ_CONTACTS, Manifest.permission.READ_PHONE_STATE, Manifest.permission.ANSWER_PHONE_CALLS, Manifest.permission.CALL_PHONE), 1)
              }
              b2.setOnClickListener {
                Toast.makeText(this, "فعل Akhali 101 من القائمة", Toast.LENGTH_LONG).show()
                startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS))
              }
              b3.setOnClickListener {
                startForegroundService(Intent(this, WakeWordService::class.java))
                Toast.makeText(this, "✅ شغال! الآن قل يا أكحلي", Toast.LENGTH_LONG).show()
                animate(true)
                status.text = "🔥 شغال الآن!\nقل بصوت عالي: يا أكحلي من المتصل\nيا أكحلي رده مشغول\nيا أكحلي اقرأ واتساب"
              }
              b4.setOnClickListener {
                val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                  putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                  putExtra(RecognizerIntent.EXTRA_LANGUAGE, "ar-SA")
                }
                startActivityForResult(i, REQ)
              }

              main.addView(circle)
              main.addView(title)
              main.addView(status)
              main.addView(b1)
              main.addView(b2)
              main.addView(b3)
              main.addView(b4)
              setContentView(main)
              animate(false)
            }

            fun animate(active: Boolean) {
              circle.animate().cancel()
              if(active) {
                ObjectAnimator.ofFloat(circle, "scaleX", 0.8f, 1.5f).apply { duration = 500; repeatCount = ObjectAnimator.INFINITE; repeatMode = ObjectAnimator.REVERSE; start() }
                ObjectAnimator.ofFloat(circle, "scaleY", 0.8f, 1.5f).apply { duration = 500; repeatCount = ObjectAnimator.INFINITE; repeatMode = ObjectAnimator.REVERSE; start() }
                circle.setTextColor(Color.parseColor("#00FF88"))
              } else {
                ObjectAnimator.ofFloat(circle, "rotation", 0f, 360f).apply { duration = 3000; repeat
