name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          mkdir -p app/src/main/java/com/akhali
          mkdir -p gradle/wrapper
          echo "distributionUrl=https://services.gradle.org/distributions/gradle-7.6-bin.zip" > gradle/wrapper/gradle-wrapper.properties
          echo "include ':app'" > settings.gradle
          cat > build.gradle << 'END1'
          buildscript{ repositories{ google(); mavenCentral() }; dependencies{ classpath 'com.android.tools.build:gradle:7.4.2'; classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.20' } }
          allprojects{ repositories{ google(); mavenCentral() } }
          END1
          cat > app/build.gradle << 'END2'
          plugins{ id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android{ namespace 'com.akhali'; compileSdk 33; defaultConfig{ applicationId "com.akhali"; minSdk 21; targetSdk 33; versionCode 106; versionName "106-LT" }; compileOptions{ sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }; kotlinOptions{ jvmTarget='17' } }
          dependencies{ implementation 'androidx.core:core-ktx:1.10.1' }
          END2
          cat > app/src/main/AndroidManifest.xml << 'END3'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.akhali">
            <uses-permission android:name="android.permission.READ_CONTACTS"/><uses-permission android:name="android.permission.READ_PHONE_STATE"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
            <application android:label="Akhali 106 LT"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application>
          </manifest>
          END3
          cat > app/src/main/java/com/akhali/MainActivity.kt << 'END5'
          package com.akhali
          import android.app.Activity
          import android.os.Bundle
          import android.speech.tts.TextToSpeech
          import android.widget.*
          import java.util.*
          class MainActivity: Activity(), TextToSpeech.OnInitListener{
            lateinit var tts: TextToSpeech
            lateinit var prefs: android.content.SharedPreferences
            lateinit var log: TextView
            override fun onCreate(b:Bundle?){
              super.onCreate(b)
              tts=TextToSpeech(this,this)
              prefs=getSharedPreferences("akhali_self",0)
              val l=LinearLayout(this).apply{orientation=LinearLayout.VERTICAL; setPadding(20,20,20,20)}
              log=TextView(this).apply{text="أكحلي 106 لجوالات LT\n\nاكتب تحت وقل له يا أكحلي طور نفسك\n"; textSize=16f}
              val input=EditText(this).apply{hint="اكتب هنا: يا أكحلي طور نفسك"}
              val btn=Button(this).apply{text="أرسل لأكحلي"}
              val btnClear=Button(this).apply{text="مسح التدريب"}
              btn.setOnClickListener{
                val q=input.text.toString().lowercase()
                var ans=""
                val custom=prefs.getStringSet("skills", mutableSetOf())?.toMutableSet()?:mutableSetOf()
                for(s in custom){ val pr=s.split("=>"); if(pr.size==2 && q.contains(pr[0])){ ans=pr[1]; break } }
                if(ans==""){
                  when{
                    q.contains("طور نفسك") -> { ans="هل تسمح لي أطور نفسي؟ اكتب: نعم أوافق"; prefs.edit().putBoolean("wait",true).apply() }
                    q.contains("نعم") && q.contains("اوافق") && prefs.getBoolean("wait",false) -> { prefs.edit().putBoolean("wait",false).putBoolean("approved",true).apply(); ans="تمت الموافقة ✅ الآن اكتب: علمتك لما اقول السلام ترد وعليكم السلام" }
                    q.contains("علمتك لما اقول") -> { if(!prefs.getBoolean("approved",false)){ ans="اكتب أولا: يا أكحلي طور نفسك" } else { val cl=q.replace("علمتك لما اقول",""); val pr=cl.split("ترد"); if(pr.size==2){ custom.add("${pr[0].trim()}=>${pr[1].trim()}"); prefs.edit().putStringSet("skills",custom).apply(); ans="حفظت! ✅ الآن لو كتبت ${pr[0]} برد عليك ${pr[1]}" } } }
                    q.contains("السلام") -> ans="وعليكم السلام يا غالي"
                    q.contains("كيف حالك") -> ans="الحمد لله بخير يا باشا"
                    else -> ans="ما فهمت، اكتب: يا أكحلي طور نفسك"
                  }
                }
                log.text="${log.text}\n\nأنت: ${input.text}\nأكحلي: $ans"
                tts.speak(ans,TextToSpeech.QUEUE_FLUSH,null,null)
                input.text.clear()
              }
              btnClear.setOnClickListener{ prefs.edit().clear().apply(); log.text="تم مسح كل التدريب"; Toast.makeText(this,"تم المسح",Toast.LENGTH_SHORT).show() }
              l.addView(log); l.addView(input); l.addView(btn); l.addView(btnClear); setContentView(l)
            }
            override fun onInit(s:Int){ tts.language=Locale("ar") }
          }
          END5
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 7.6
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Akhali-106-LT-EDITION
          path: app/build/outputs/apk/debug/*.apk
