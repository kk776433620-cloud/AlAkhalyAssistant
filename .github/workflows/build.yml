name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build 176 ULTIMATE ALL FEATURES IN ONE FILE DETAILED
        shell: bash
        run: |
          set -e
          echo "START 176 ALL FEATURES DETAILED NO MISSING"
          rm -rf build.gradle app/build.gradle settings.gradle gradle.properties gradle
          mkdir -p gradle/wrapper app/src/main/java/com/akhali app/src/main/res/xml
          echo "include ':app'" > settings.gradle
          echo "android.useAndroidX=true" > gradle.properties
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-7.6-bin.zip" > gradle/wrapper/gradle-wrapper.properties
          python3 << 'PY'
          import pathlib
          # 1- ملفات البناء
          pathlib.Path("build.gradle").write_text("buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:7.4.2'; classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.20' } } allprojects { repositories { google(); mavenCentral() } }")
          pathlib.Path("app/build.gradle").write_text("plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' } android { namespace 'com.akhali'; compileSdk 33; defaultConfig { applicationId \"com.akhali.yemeni\"; minSdk 21; targetSdk 28; versionCode 176; versionName \"176-ULTIMATE\" } } dependencies { implementation 'androidx.core:core-ktx:1.6.0' }")
          pathlib.Path("app/src/main/res/xml/access.xml").write_text('<accessibility-service xmlns:android="http://schemas.android.com/apk/res/android" android:accessibilityEventTypes="typeAllMask" android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows|flagReportViewIds|flagIncludeNotImportantViews" android:canPerformGestures="true" android:canRetrieveWindowContent="true" android:accessibilityFeedbackType="feedbackSpoken"/>')
          pathlib.Path("app/src/main/AndroidManifest.xml").write_text('<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.akhali.yemeni"><uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE"/><uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/><uses-permission android:name="android.permission.SEND_SMS"/><uses-permission android:name="android.permission.READ_SMS"/><uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/><uses-permission android:name="android.permission.BIND_ACCESSIBILITY_SERVICE"/><uses-permission android:name="android.permission.WAKE_LOCK"/><uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/><application android:label="الاكحلي الذكي العملاق"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity><activity android:name=".LabActivity" android:exported="false"/><service android:name=".BgService" android:exported="false"/><service android:name=".SmartControlService" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" android:exported="true"><intent-filter><action android:name="android.accessibilityservice.AccessibilityService"/></intent-filter><meta-data android:name="android.accessibilityservice" android:resource="@xml/access"/></service></application></manifest>')
          # 2- كرة سيري الخلفية المتحركة بالوان حلوة
          pathlib.Path("app/src/main/java/com/akhali/SiriOrbView.kt").write_text("""
          package com.akhali
          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.*
          import android.view.View
          import kotlin.math.sin
          class SiriOrbView(c:Context):View(c){
            var t=0f; var speaking=false
            var paint=Paint(Paint.ANTI_ALIAS_FLAG)
            var glow=Paint(Paint.ANTI_ALIAS_FLAG)
            init{
              glow.maskFilter=BlurMaskFilter(60f, BlurMaskFilter.Blur.NORMAL)
              ValueAnimator.ofFloat(0f,360f).apply{duration=4000;repeatCount=ValueAnimator.INFINITE;addUpdateListener{t=it.animatedValue as Float;invalidate()};start()}
            }
            fun startSpeaking(){speaking=true}
            fun stopSpeaking(){speaking=false}
            override fun onDraw(c:Canvas){
              super.onDraw(c)
              val cx=width/2f; val cy=height/2f
              val baseR=if(speaking) 180f + 40f*sin(Math.toRadians(t*4.0)).toFloat() else 150f + 15f*sin(Math.toRadians(t.toDouble())).toFloat()
              for(i in 4 downTo 0){val r=baseR + i*35f; glow.color=Color.argb(35 - i*6, 120+i*25, 80+i*35, 255); c.drawCircle(cx,cy,r,glow)}
              val colors=intArrayOf(Color.parseColor("#9C27B0"),Color.parseColor("#2196F3"),Color.parseColor("#E91E63"),Color.parseColor("#673AB7"),Color.parseColor("#00BCD4"),Color.parseColor("#9C27B0"))
              val shader=RadialGradient(cx,cy,baseR,colors,floatArrayOf(0f,0.2f,0.4f,0.6f,0.8f,1f),Shader.TileMode.CLAMP)
              paint.shader=shader; c.drawCircle(cx,cy,baseR,paint)
              if(speaking){val wp=Paint(Paint.ANTI_ALIAS_FLAG); wp.style=Paint.Style.STROKE; wp.strokeWidth=5f; for(j in 0..4){val wr=baseR + 20f + j*28f + 18f*sin(Math.toRadians((t*2.5 + j*70).toDouble())).toFloat(); wp.color=Color.argb(80 - j*12, 150+j*20, 100+j*30, 255); c.drawCircle(cx,cy,wr,wp)}}
              val white=Paint(Paint.ANTI_ALIAS_FLAG); white.color=Color.argb(140,255,255,255); c.drawCircle(cx - baseR*0.33f, cy - baseR*0.33f, baseR*0.24f, white)
              val small=Paint(Paint.ANTI_ALIAS_FLAG); small.color=Color.argb(90,255,255,255); c.drawCircle(cx - baseR*0.18f, cy - baseR*0.52f, baseR*0.09f, small)
            }
          }
          """)
          # 3- التحكم الكامل بالهاتف
          pathlib.Path("app/src/main/java/com/akhali/SmartControlService.kt").write_text("""
          package com.akhali
          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import android.os.Build
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          class SmartControlService:AccessibilityService(){
            companion object{var instance:SmartControlService?=null}
            override fun onServiceConnected(){super.onServiceConnected();instance=this}
            override fun onAccessibilityEvent(e:AccessibilityEvent?){}
            override fun onInterrupt(){}
            fun readScreen():String{
              val root=rootInActiveWindow?: return "ما في شاشة - فعل التحكم الكامل زر 2"
              var txt="";fun rd(n:AccessibilityNodeInfo){if(n.text!=null) txt+=n.text.toString()+" "; if(n.contentDescription!=null) txt+=n.contentDescription.toString()+" "; for(i in 0 until n.childCount){val c=n.getChild(i); if(c!=null){rd(c); c.recycle()}}};rd(root);return txt.ifEmpty{"شاشة فاضية"}
            }
            fun clickAt(x:Float, y:Float){if(Build.VERSION.SDK_INT>=24){val p=Path(); p.moveTo(x,y); val g=GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(p,0,100)).build(); dispatchGesture(g,null,null)}}
            fun swipeUp(){if(Build.VERSION.SDK_INT>=24){val p=Path(); p.moveTo(500f,1500f); p.lineTo(500f,300f); dispatchGesture(GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(p,0,400)).build(),null,null)}}
            fun swipeDown(){if(Build.VERSION.SDK_INT>=24){val p=Path(); p.moveTo(500f,300f); p.lineTo(500f,1500f); dispatchGesture(GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(p,0,400)).build(),null,null)}}
            fun swipeLeft(){if(Build.VERSION.SDK_INT>=24){val p=Path(); p.moveTo(800f,800f); p.lineTo(100f,800f); dispatchGesture(GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(p,0,400)).build(),null,null)}}
            fun swipeRight(){if(Build.VERSION.SDK_INT>=24){val p=Path(); p.moveTo(100f,800f); p.lineTo(800f,800f); dispatchGesture(GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(p,0,400)).build(),null,null)}}
            fun doHome(){performGlobalAction(GLOBAL_ACTION_HOME)}
            fun doBack(){performGlobalAction(GLOBAL_ACTION_BACK)}
            fun doRecent(){performGlobalAction(GLOBAL_ACTION_RECENTS)}
            fun doNotification(){performGlobalAction(GLOBAL_ACTION_NOTIFICATIONS)}
            fun doQuickSettings(){performGlobalAction(GLOBAL_ACTION_QUICK_SETTINGS)}
            fun clickByText(text:String):Boolean{
              val root=rootInActiveWindow?: return false
              fun find(n:AccessibilityNodeInfo):AccessibilityNodeInfo?{
                if(n.text!=null && n.text.toString().contains(text, true)) return n
                if(n.contentDescription!=null && n.contentDescription.toString().contains(text, true)) return n
                for(i in 0 until n.childCount){val c=n.getChild(i); if(c!=null){val f=find(c); if(f!=null) return f; c.recycle()}}
                return null
              }
              val node=find(root)
              return if(node!=null){node.performAction(AccessibilityNodeInfo.ACTION_CLICK); true} else false
            }
            fun typeText(text:String):Boolean{
              val root=rootInActiveWindow?: return false
              fun findEdit(n:AccessibilityNodeInfo):AccessibilityNodeInfo?{
                if(n.className!=null && n.className.toString().contains("EditText")) return n
                for(i in 0 until n.childCount){val c=n.getChild(i); if(c!=null){val f=findEdit(c); if(f!=null) return f; c.recycle()}}
                return null
              }
              val edit=findEdit(root)
              return if(edit!=null){val args=android.os.Bundle(); args.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, text); edit.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args); true} else false
            }
          }
          """)
          # 4- الشاشة الرئيسية بكل المميزات 0-8 + صوت + كرة سيري
          pathlib.Path("app/src/main/java/com/akhali/MainActivity.kt").write_text("""
          package com.akhali
          import android.app.Activity
          import android.app.AlertDialog
          import android.app.DownloadManager
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.provider.Settings
          import android.speech.RecognizerIntent
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import android.speech.tts.Voice
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import java.util.Locale
          class MainActivity:Activity(), TextToSpeech.OnInitListener{
            var tts:TextToSpeech?=null; var orb:SiriOrbView?=null; var pitch=1.05f; var rate=0.93f
            override fun onCreate(b:Bundle?){
              super.onCreate(b)
              tts=TextToSpeech(this,this)
              val sp=getSharedPreferences("ultimate",0); pitch=sp.getFloat("pitch",1.05f); rate=sp.getFloat("rate",0.93f)
              val scroll=ScrollView(this); scroll.setBackgroundColor(Color.parseColor("#050510"))
              val lay=LinearLayout(this); lay.orientation=LinearLayout.VERTICAL; lay.setPadding(25,25,25,25)
              orb=SiriOrbView(this); lay.addView(orb, LinearLayout.LayoutParams(-1, 750))
              val tv=TextView(this); tv.setTextColor(Color.WHITE); tv.textSize=13f
              fun ref(){tv.text="الاكحلي الذكي العملاق v176 ULTIMATE\\nكل المميزات في ملف واحد بالتفصيل الممل\\nصوت: $pitch سرعة $rate\\nقول يا اكحلي حتى والشاشة مقفلة والجوال على الشاحن\\nLT اندرويد 9 - ما ينفذ الا باذنك\\n0-8 + كرة سيري + معمل + ذاكرة + لغات + تحكم كامل"}
              ref()
              fun ask(m:String,y:()->Unit){AlertDialog.Builder(this).setTitle("يا الاكحلي اذن لي؟").setMessage(m).setPositiveButton("اسمح"){_,_->y()}.setNegativeButton("لا",null).show()}
              fun style(b:Button){b.setBackgroundColor(Color.parseColor("#1E1E3A"));b.setTextColor(Color.WHITE)}
              fun save(p:Float,r:Float,n:String){pitch=p;rate=r;sp.edit().putFloat("pitch",p).putFloat("rate",r).apply();tts?.setPitch(p);tts?.setSpeechRate(r);tts?.speak("تمام يا الاكحلي صوتي $n",TextToSpeech.QUEUE_FLUSH,null,"v");ref()}
              val bSiri=Button(this); bSiri.text="صوت سيري ناعم واقعي (1.05)"; style(bSiri)
              val bYem=Button(this); bYem.text="صوت يمني رجولي فخم (0.85)"; style(bYem)
              val bDeep=Button(this); bDeep.text="صوت جهوري ثقيل (0.75)"; style(bDeep)
              val bNorm=Button(this); bNorm.text="صوت طبيعي عادي (1.0)"; style(bNorm)
              bSiri.setOnClickListener{save(1.05f,0.93f,"ناعم مثل سيري")}
              bYem.setOnClickListener{save(0.85f,0.95f,"يمني رجولي فخم")}
              bDeep.setOnClickListener{save(0.75f,0.90f,"جهوري ثقيل")}
              bNorm.setOnClickListener{save(1.0f,1.0f,"طبيعي")}
              val b0=Button(this); b0.text="0- كلم الاكحلي (صوت واقعي) وهو يرد والكرة تتحرك بالوان حلوة"; style(b0)
              val b1=Button(this); b1.text="1- اسمح للنت (عدة منافذ: واي فاي + بيانات + API)"; style(b1)
              val b2=Button(this); b2.text="2- اسمح بالتحكم الكامل بالهاتف (مهم جدا) - يدوس ويكتب ويقرا"; style(b2)
              val b3=Button(this); b3.text="3- اسمح يطفو فوق التطبيقات (SYSTEM_ALERT_WINDOW)"; style(b3)
              val b4=Button(this); b4.text="4- شغل يا اكحلي يسمع لحاله حتى والشاشة مقفلة - حاضر من عيوني - الجوال على الشاحن وانت بعيد"; style(b4)
              val b5=Button(this); b5.text="5- افتح معمل الاكحلي (الذاكرة + اللغات + يحدث نفسه + يتعلم)"; style(b5)
              val b6=Button(this); b6.text="6- يبحث لك في النت (باذنك) - Google Search"; style(b6)
              val b7=Button(this); b7.text="7- ينسخ النص (باذنك) - Clipboard"; style(b7)
              val b8=Button(this); b8.text="8- تحديث نفسه بنفسه تلقائيا - يحمل APK الجديد"; style(b8)
              b0.setOnClickListener{ask("اشتي اسمعك وارد والكرة تتحرك بالوان، تسمح؟"){try{val i=Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL,RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);i.putExtra(RecognizerIntent.EXTRA_LANGUAGE,"ar-YE");i.putExtra(RecognizerIntent.EXTRA_PROMPT,"تكلم يا الاكحلي");startActivityForResult(i,100)}catch(e:Exception){Toast.makeText(this,"نزل Google App",1).show()}}}
              b1.setOnClickListener{ask("اشتي اشل من عدة منافذ من النت (واي فاي وبيانات وAPIs)، تسمح؟"){sp.edit().putBoolean("allow_net",true).apply();Toast.makeText(this,"تم السماح للنت من كل المنافذ",0).show()}}
              b2.setOnClickListener{ask("اشتي اتحكم بجوالك LT كليا (ادوس، اسحب، اكتب، اقرا الشاشة، افتح تطبيقات)، تسمح؟"){startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))}}
              b3.setOnClickListener{ask("اشتي اطفو فوق التطبيقات (واتساب وغيره)، تسمح؟"){if(Build.VERSION.SDK_INT>=23 &&!Settings.canDrawOverlays(this)){startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,Uri.parse("package:$packageName")))}}}
              b4.setOnClickListener{ask("اشتي اسمع لحالي دائما حتى والشاشة مقفلة وانت بعيد والجوال على الشاحن، اقول حاضر من عيوني وادخل الرسائل وارسل لفلان اني مشغول؟"){val i=Intent(this,BgService::class.java);if(Build.VERSION.SDK_INT>=26) startForegroundService(i) else startService(i);Toast.makeText(this,"الآن بيسمع لحاله حتى والشاشة مقفلة - قول يا اكحلي من بعيد",1).show()}}
              b5.setOnClickListener{startActivity(Intent(this,LabActivity::class.java))}
              b6.setOnClickListener{ask("ابحث لك في النت؟"){startActivity(Intent(Intent.ACTION_VIEW,Uri.parse("https://www.google.com/search?q=الاكحلي+اليمن")))}}
              b7.setOnClickListener{ask("انسخ؟"){val cm=getSystemService(CLIPBOARD_SERVICE) as ClipboardManager;cm.setPrimaryClip(ClipData.newPlainText("الاكحلي","نسخ باذنك يا الاكحلي"));Toast.makeText(this,"نسخت",0).show()}}
              b8.setOnClickListener{ask("احدث نفسي بنفسي واحمل النسخة الجديدة؟"){val dm=getSystemService(DOWNLOAD_SERVICE) as DownloadManager;val req=DownloadManager.Request(Uri.parse("https://github.com/AlAkhaly/AlAkhalyAssistant/releases/latest/download/app-debug.apk"));req.setTitle("الاكحلي يحدث نفسه بنفسه");req.setDescription("يحمل APK الجديد");req.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS,"alakhali-self-update.apk");req.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);dm.enqueue(req);Toast.makeText(this,"يحدث نفسه بنفسه الآن بيحمل",1).show()}}
              lay.addView(tv);lay.addView(bSiri);lay.addView(bYem);lay.addView(bDeep);lay.addView(bNorm);lay.addView(b0);lay.addView(b1);lay.addView(b2);lay.addView(b3);lay.addView(b4);lay.addView(b5);lay.addView(b6);lay.addView(b7);lay.addView(b8);scroll.addView(lay);setContentView(scroll)
            }
            override fun onActivityResult(rc:Int,res:Int,data:Intent?){
              super.onActivityResult(rc,res,data)
              if(rc==100 && res==RESULT_OK){
                val said=data?.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS)?.get(0)?:""
                if(said.isNotEmpty()){
                  var ans="سمعتك تقول $said حاضر من عيوني"
                  val s=said.lowercase()
                  if(s.contains("سلام")||s.contains("حيا")) ans="هلا يا الاكحلي انا هنا معك حتى في الخلفية والكرة تتحرك بالوان حلوة"
                  else if(s.contains("كيف")) ans="انا بخير شكرا يا الاكحلي"
                  else if(s.contains("ابحث")){ans="حاضر من عيوني ابحث لك";startActivity(Intent(Intent.ACTION_VIEW,Uri.parse("https://www.google.com/search?q=$said")))}
                  tts?.speak(ans,TextToSpeech.QUEUE_FLUSH,null,"talk")
                }
              }
            }
            override fun onInit(s:Int){
              if(s==TextToSpeech.SUCCESS){
                tts?.language=Locale("ar");tts?.setPitch(pitch);tts?.setSpeechRate(rate)
                try{if(Build.VERSION.SDK_INT>=21){var best:Voice?=null;for(v in tts?.voices!!){if(v.locale.language=="ar"){if(best==null||v.quality>best.quality) best=v}};if(best!=null) tts?.voice=best}}catch(e:Exception){}
                tts?.setOnUtteranceProgressListener(object:UtteranceProgressListener(){
                  override fun onStart(id:String?){runOnUiThread{orb?.startSpeaking()}}
                  override fun onDone(id:String?){runOnUiThread{orb?.stopSpeaking()}}
                  override fun onError(id:String?){runOnUiThread{orb?.stopSpeaking()}}
                })
                tts?.speak("حيا يا الاكحلي انا العملاق الكامل بكل المميزات كرة سيري تتحرك",TextToSpeech.QUEUE_FLUSH,null,"talk")
              }
            }
          }
          """)
          # 5- المعمل العملاق مع كل شي: ذاكرة + لغات + يحدث نفسه + يتعلم + تحكم كامل
          pathlib.Path("app/src/main/java/com/akhali/LabActivity.kt").write_text("""
          package com.akhali
          import android.app.Activity
          import android.app.AlertDialog
          import android.app.DownloadManager
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.speech.tts.TextToSpeech
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import java.util.Date
          import java.util.Locale
          class LabActivity:Activity(), TextToSpeech.OnInitListener{
            var tts:TextToSpeech?=null; var orb:SiriOrbView?=null; var infoTv:TextView?=null
            override fun onCreate(b:Bundle?){
              super.onCreate(b)
              tts=TextToSpeech(this,this)
              val sp=getSharedPreferences("ultimate",0)
              val scroll=ScrollView(this); scroll.setBackgroundColor(Color.parseColor("#050510"))
              val lay=LinearLayout(this); lay.orientation=LinearLayout.VERTICAL; lay.setPadding(20,20,20,20)
              orb=SiriOrbView(this); lay.addView(orb, LinearLayout.LayoutParams(-1, 550))
              infoTv=TextView(this); infoTv?.setTextColor(Color.WHITE); infoTv?.textSize=11f
              fun refresh(){
                val ver=sp.getInt("ver",1); val memCount=sp.getInt("mem_count",0)
                val langs=sp.getString("langs","Kotlin, Java, Python, JavaScript, C++, Go, Rust, Dart, Swift, TypeScript")?: ""
                var txt="=== معمل الاكحلي العملاق ULTIMATE v$ver ===\\n${Build.MODEL} | ${Build.MANUFACTURER} | Android ${Build.VERSION.RELEASE}\\n${Date()}\\n\\n--- 1. اللغات البرمجية (${langs.split(",").size}) ---\\n$langs\\n\\n--- 2. الذاكرة (${memCount} ذاكرة محفوظة) ---\\n"
                for(i in 1..memCount.coerceAtMost(20)){txt+=sp.getString("mem_$i","")+"\\n"}
                txt+="\\n--- 3. الدوال والتعلم من كل المنافذ (${ver} دالة) ---\\n"
                for(i in 1..ver.coerceAtMost(20)){val d=sp.getString("func_$i",""); if(d!="") txt+="دالة $i: $d\\n"}
                txt+="\\n--- 4. التحكم الكامل بالهاتف ---\\nقادر يدوس، يسحب، يكتب، يقرا، يفتح تطبيقات\\n--- 5. يحدث نفسه بنفسه ---\\nيحمل APK من GitHub\\n"
                infoTv?.text=txt
              }
              refresh()
              fun style(b:Button){b.setBackgroundColor(Color.parseColor("#1E1E3A")); b.setTextColor(Color.WHITE)}
              fun ask(m:String,y:()->Unit){AlertDialog.Builder(this).setTitle("اذن يا الاكحلي؟").setMessage(m).setPositiveButton("اسمح"){_,_->y()}.setNegativeButton("لا",null).show()}
