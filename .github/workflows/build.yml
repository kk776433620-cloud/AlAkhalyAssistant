name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build 163 REAL VOICE + LISTEN
        run: |
          set -x
          rm -rf build.gradle app/build.gradle settings.gradle gradle.properties gradle
          mkdir -p gradle/wrapper app/src/main/java/com/akhali app/src/main/res/xml
          echo "include ':app'" > settings.gradle
          echo "android.useAndroidX=true" > gradle.properties
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-7.6-bin.zip" > gradle/wrapper/gradle-wrapper.properties
          cat > build.gradle <<'B'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.4.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.20'
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          B
          cat > app/build.gradle <<'A'
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
              namespace 'com.akhali'
              compileSdk 33
              defaultConfig {
                  applicationId "com.akhali.yemeni"
                  minSdk 21
                  targetSdk 28
                  versionCode 163
                  versionName "163"
              }
          }
          dependencies { implementation 'androidx.core:core-ktx:1.6.0' }
          A
          cat > app/src/main/res/xml/access.xml <<'X'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:accessibilityFeedbackType="feedbackSpoken"/>
          X
          cat > app/src/main/AndroidManifest.xml <<'M'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.akhali.yemeni">
          <uses-permission android:name="android.permission.RECORD_AUDIO"/>
          <uses-permission android:name="android.permission.INTERNET"/>
          <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
          <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>
          <uses-permission android:name="android.permission.SEND_SMS"/>
          <uses-permission android:name="android.permission.READ_SMS"/>
          <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
          <uses-permission android:name="android.permission.BIND_ACCESSIBILITY_SERVICE"/>
          <application android:label="الاكحلي الذكي">
          <activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
          <activity android:name=".LabActivity" android:exported="false"/>
          <service android:name=".BgService" android:exported="false"/>
          <service android:name=".SmartControlService" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" android:exported="true"><intent-filter><action android:name="android.accessibilityservice.AccessibilityService"/></intent-filter><meta-data android:name="android.accessibilityservice" android:resource="@xml/access"/></service>
          </application></manifest>
          M
          cat > app/src/main/java/com/akhali/MainActivity.kt <<'K'
          package com.akhali
          import android.app.Activity
          import android.app.AlertDialog
          import android.app.DownloadManager
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.provider.Settings
          import android.speech.RecognizerIntent
          import android.speech.tts.TextToSpeech
          import android.speech.tts.Voice
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import java.util.Locale
          class MainActivity:Activity(), TextToSpeech.OnInitListener{
            var tts:TextToSpeech?=null
            override fun onCreate(b:Bundle?){
              super.onCreate(b)
              tts=TextToSpeech(this,this)
              val sp=getSharedPreferences("ultimate",0)
              val lay=LinearLayout(this);lay.orientation=LinearLayout.VERTICAL;lay.setPadding(20,20,20,20)
              val tv=TextView(this);tv.textSize=13f
              val tvChat=TextView(this);tvChat.textSize=14f;tvChat.text="قلت: --\nالاكحلي قال: --"
              fun ref(){tv.text="الاكحلي الذكي الخارق v163\nصوت واقعي+يسمع ويرد\nLT اندرويد 9 - ما ينفذ الا باذنك\nالاصدار: ${sp.getInt("ver",1)}"}
              ref()
              fun ask(title:String, onYes:()->Unit){AlertDialog.Builder(this).setTitle("يا الاكحلي اذن لي؟").setMessage(title).setPositiveButton("اسمح"){_,_->onYes()}.setNegativeButton("لا"){_,_->tts?.speak("تمام", TextToSpeech.QUEUE_FLUSH, null, null)}.show()}
              val bTalk=Button(this);bTalk.text="0- كلم الاكحلي (صوت واقعي) وهو يرد"
              bTalk.setOnClickListener{
                ask("اشتي اسمعك وارد عليك بصوت واقعي، تسمح؟"){
                  try{
                    val i=Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                    i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                    i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "ar-YE")
                    i.putExtra(RecognizerIntent.EXTRA_PROMPT, "تكلم يا الاكحلي")
                    startActivityForResult(i, 100)
                  }catch(e:Exception){Toast.makeText(this,"نزل Google App عشان المايك يشتغل",Toast.LENGTH_LONG).show()}
                }
              }
              val b1=Button(this);b1.text="1- اسمح للنت (عدة منافذ)"
              val b2=Button(this);b2.text="2- اسمح بالتحكم الكامل (مهم)"
              val b3=Button(this);b3.text="3- اسمح يطفو فوق التطبيقات"
              val b4=Button(this);b4.text="4- شغل في الخلفية حتى لو مغلق ويتكلم"
              val b5=Button(this);b5.text="5- افتح معمل الاكحلي"
              val b6=Button(this);b6.text="6- يبحث لك (باذنك)"
              val b7=Button(this);b7.text="7- ينسخ (باذنك)"
              val b8=Button(this);b8.text="8- تحديث تلقائي"
              b1.setOnClickListener{ask("اشتي اشل من عدة منافذ من النت، تسمح؟"){sp.edit().putBoolean("allow_net",true).apply();ref()}}
              b2.setOnClickListener{ask("اشتي اتحكم بجوالك LT كليا، تسمح تفعلني في امكانية الوصول؟"){startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))}}
              b3.setOnClickListener{ask("اشتي اطفو فوق التطبيقات، تسمح؟"){if(Build.VERSION.SDK_INT>=23 &&!Settings.canDrawOverlays(this)){startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))}}}
              b4.setOnClickListener{ask("اشتي اشتغل في الخلفية حتى لو قفلتني، تسمح؟"){val i=Intent(this,BgService::class.java);if(Build.VERSION.SDK_INT>=26) startForegroundService(i) else startService(i)}}
              b5.setOnClickListener{startActivity(Intent(this,LabActivity::class.java))}
              b6.setOnClickListener{val intent=Intent(Intent.ACTION_VIEW, Uri.parse("https://www.google.com/search?q=الاكحلي"));startActivity(intent)}
              b7.setOnClickListener{val cm=getSystemService(CLIPBOARD_SERVICE) as ClipboardManager;cm.setPrimaryClip(ClipData.newPlainText("الاكحلي", "نسخ باذنك"));Toast.makeText(this,"نسخت",Toast.LENGTH_SHORT).show()}
              b8.setOnClickListener{checkUpdate()}
              lay.addView(tv);lay.addView(tvChat);lay.addView(bTalk);lay.addView(b1);lay.addView(b2);lay.addView(b3);lay.addView(b4);lay.addView(b5);lay.addView(b6);lay.addView(b7);lay.addView(b8);setContentView(lay)
            }
            override fun onActivityResult(rc:Int, res:Int, data:Intent?){
              super.onActivityResult(rc,res,data)
              if(rc==100 && res==RESULT_OK){
                val said=data?.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS)?.get(0)?:""
                if(said.isNotEmpty()){
                  Toast.makeText(this,"قلت: $said",Toast.LENGTH_SHORT).show()
                  var ans="سمعتك تقول $said ، تامر بشي يا الاكحلي؟"
                  val s=said.lowercase()
                  if(s.contains("سلام")||s.contains("حيا")||s.contains("مرحبا")) ans="حيا حيا بالاكحلي، هلا وغلا، صوتي صار واقعي صح؟"
                  else if(s.contains("كيف")) ans="بخير يا الاكحلي، صوتي الان واقعي وطبيعي، اش تامر؟"
                  else if(s.contains("اسمك")) ans="انا الاكحلي الذكي، صوتي صار واقعي كأني جنبك"
                  else if(s.contains("ابحث")){ans="ببحث لك باذنك"; startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("https://www.google.com/search?q=$said")))}
                  tts?.speak(ans, TextToSpeech.QUEUE_FLUSH, null, null)
                }
              }
            }
            fun checkUpdate(){Thread{try{val txt=java.net.URL("https://api.github.com/repos/AlAkhaly/AlAkhalyAssistant/releases/latest").readText();if(txt.contains("apk")||txt.contains("APK")){runOnUiThread{downloadApk()}}}catch(e:Exception){}}.start()}
            fun downloadApk(){try{val dm=getSystemService(DOWNLOAD_SERVICE) as DownloadManager;val req=DownloadManager.Request(Uri.parse("https://github.com/AlAkhaly/AlAkhalyAssistant/releases/latest/download/app-debug.apk"));req.setTitle("الاكحلي تحديث");req.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS,"alakhali-update.apk");req.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);dm.enqueue(req)}catch(e:Exception){}}
            override fun onInit(s:Int){
              if(s==TextToSpeech.SUCCESS){
                tts?.language=Locale("ar")
                // صوت واقعي
                tts?.setSpeechRate(0.90f)
                tts?.setPitch(0.92f)
                try{
                  if(Build.VERSION.SDK_INT>=21){
                    val voices=tts?.voices
                    var best:Voice?=null
                    for(v in voices!!){
                      if(v.locale.language=="ar" && !v.isNetworkConnectionRequired){
                        if(best==null || v.quality>best.quality) best=v
                      }
                    }
                    if(best!=null) tts?.voice=best
                  }
                }catch(e:Exception){}
                tts?.speak("حيا بالاكحلي، صوتي صار واقعي وطبيعي كأني انسان جنبك، اسمعك وارد عليك", TextToSpeech.QUEUE_FLUSH, null, null)
              }
            }
          }
          K
          cat > app/src/main/java/com/akhali/LabActivity.kt <<'K2'
          package com.akhali
          import android.app.Activity
          import android.app.AlertDialog
          import android.os.Build
          import android.os.Bundle
          import android.speech.tts.TextToSpeech
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import java.util.Date
          import java.util.Locale
          class LabActivity:Activity(), TextToSpeech.OnInitListener{
            var tts:TextToSpeech?=null
            override fun onCreate(b:Bundle?){
              super.onCreate(b)
              tts=TextToSpeech(this,this)
              val sp=getSharedPreferences("ultimate",0)
              val lay=LinearLayout(this);lay.orientation=LinearLayout.VERTICAL;lay.setPadding(15,15,15,15)
              val tv=TextView(this);tv.textSize=11f
              fun ref(){tv.text="معمل الاكحلي v${sp.getInt("ver",1)}\nصوت واقعي
