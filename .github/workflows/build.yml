name: Build Real APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix Project Structure
        run: |
          ls -la
          unzip -o "*.zip" || true
          echo "--- after unzip ---"
          ls -la
          find . -maxdepth 3 -type d | sort
          # إذا في مجلد AlAkhalyAssistant/AlAkhalyAssistant نصلحه
          if [ -d "AlAkhalyAssistant/app" ]; then
            echo "Found at root"
            mv AlAkhalyAssistant/* . || true
          fi
          # دور على مكان gradlew الحقيقي
          GRADLE_DIR=$(find . -name "gradlew" -type f | head -1 | xargs dirname)
          echo "Gradle dir is: $GRADLE_DIR"
          echo "GRADLE_DIR=$GRADLE_DIR" >> $GITHUB_ENV
          ls -la "$GRADLE_DIR"

      - name: Build APK
        run: |
          cd ${{ env.GRADLE_DIR }}
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlAkhali-APK-Fixed
          path: |
            **/app/build/outputs/apk/debug/*.apk
            ${{ env.GRADLE_DIR }}/app/build/outputs/apk/debug/*.apk
