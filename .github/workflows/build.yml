name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Build 142 Android9 COMPILE FIX
        run: |
          rm -rf app/build.gradle build.gradle settings.gradle gradle.properties gradle
          mkdir -p gradle/wrapper app/src/main/java/com/akhali
          echo "android.useAndroidX=true" > gradle.properties
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-7.6-bin.zip" > gradle/wrapper/gradle-wrapper.properties
          echo "include ':app'" > settings.gradle
          cat > build.gradle <<'ROOT'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.4.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.20'
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          ROOT
          cat > app/build.gradle <<'APP'
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android { namespace 'com.akhali'; compileSdk 28; defaultConfig { applicationId "com.akhali.yemeni"; minSdk 21; targetSdk 28; versionCode 142; versionName "142" } }
          dependencies { implementation 'androidx.core:core-ktx:1.0.2' }
          APP
          cat > app/src/main/AndroidManifest.xml <<'MAN'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.akhali.yemeni"><uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/><application android:label="Akhali 142"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity><activity android:name=".LabActivity" android:exported="false"/><service android:name=".BgService" android:exported="false"/></application></manifest>
          MAN
          cat > app/src/main/java/com/akhali/MainActivity.kt <<'KT'
          package com.akhali
          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          class MainActivity:Activity(){
            override fun onCreate(b:Bundle?){
              super.onCreate(b)
              val sp=getSharedPreferences("ultimate",0)
              val lay=LinearLayout(this)
              lay.orientation=LinearLayout.VERTICAL
              lay.setPadding(30,30,30,30)
              val tv=TextView(this)
              tv.text="Akhali 142 Android 9 Version ${sp.getInt("code_ver",1)} Kotlin Self-Code Net Control"
              val btn=Button(this)
              btn.text="Lab - Programming System"
              btn.setOnClickListener{ startActivity(Intent(this,LabActivity::class.java)) }
              lay.addView(tv)
              lay.addView(btn)
              setContentView(lay)
            }
          }
          KT
          cat > app/src/main/java/com/akhali/LabActivity.kt <<'KT2'
          package com.akhali
          import android.app.Activity
          import android.os.Bundle
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          class LabActivity:Activity(){
            override fun onCreate(b:Bundle?){
              super.onCreate(b)
              val sp=getSharedPreferences("ultimate",0)
              val lay=LinearLayout(this)
              lay.orientation=LinearLayout.VERTICAL
              val tv=TextView(this)
              fun refresh(){ tv.text="System v${sp.getInt("v",1)}" }
              refresh()
              val btn=Button(this)
              btn.text="Program new function"
              btn.setOnClickListener{
                val v=sp.getInt("v",1)+1
                sp.edit().putInt("v",v).apply()
                refresh()
              }
              lay.addView(tv)
              lay.addView(btn)
              setContentView(lay)
            }
          }
          KT2
          cat > app/src/main/java/com/akhali/BgService.kt <<'KT3'
          package com.akhali
          import android.app.Service
          import android.content.Intent
          import android.os.IBinder
          class BgService:Service(){
            override fun onBind(i:Intent?):IBinder?=null
          }
          KT3
          curl -sL https://services.gradle.org/distributions/gradle-7.6-bin.zip -o /tmp/g.zip
          unzip -q /tmp/g.zip -d /tmp/
          /tmp/gradle-7.6/bin/gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Akhali-142-Android9-APK
          path: app/build/outputs/apk/debug/*.apk
