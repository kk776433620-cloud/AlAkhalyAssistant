name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build 133 Ultimate with Download
        run: |
          rm -rf app/build.gradle build.gradle settings.gradle gradle.properties
          mkdir -p gradle/wrapper app/src/main/java/com/akhali
          echo "android.useAndroidX=true" > gradle.properties
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-7.6-bin.zip" > gradle/wrapper/gradle-wrapper.properties
          echo "include ':app'" > settings.gradle
          cat > build.gradle <<'ROOT'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.4.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.20'
              }
          }
          task clean(type: Delete) { delete rootProject.buildDir }
          ROOT
          cat > app/build.gradle <<'APP'
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
              namespace 'com.akhali'
              compileSdk 33
              defaultConfig {
                  applicationId "com.akhali.yemeni"
                  minSdk 21
                  targetSdk 33
                  versionCode 133
                  versionName "133-ULTIMATE"
              }
              buildTypes { release { minifyEnabled false } debug { minifyEnabled false } }
          }
          dependencies { implementation 'androidx.core:core-ktx:1.10.1' }
          APP
          cat > app/src/main/AndroidManifest.xml <<'MAN'
          <?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.INTERNET"/>
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/><uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
          <uses-permission android:name="android.permission.CALL_PHONE"/><uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/><uses-permission android:name="android.permission.CHANGE_WIFI_STATE"/>
          <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
          <application android:label="Akhali 133 Ultimate"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity><activity android:name=".OverlayActivity" android:exported="false" android:theme="@android:style/Theme.Translucent.NoTitleBar"/><activity android:name=".LabActivity" android:exported="false"/><activity android:name=".ResearchActivity" android:exported="false"/><service android:name=".BgService" android:exported="false" android:foregroundServiceType="microphone"/></application></manifest>
          MAN
          mkdir -p app/src/main/java/com/akhali
          cat > app/src/main/java/com/akhali/MainActivity.kt <<'KT'
          package com.akhali
          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.*
          class MainActivity: Activity(){
            override fun onCreate(b:Bundle?){
              super.onCreate(b)
              val sp=getSharedPreferences("ultimate",0)
              val ver=sp.getInt("code_ver",1)
              val l=LinearLayout(this).apply{orientation=LinearLayout.VERTICAL; setPadding(30,30,30,30)}
              l.addView(TextView(this).apply{text="أكحلي 133 ULTIMATE 🤖🇾🇪\n\nإصدار كوده: v$ver\nنظام Kotlin حديث\nيبرمج نفسه + يبحث + يتحكم\n\n🌐 النت: ${if(sp.getBoolean("allow_net",false))"✅" else "❌"}\n📱 التحكم: ${if(sp.getBoolean("allow_control",false))"✅" else "❌"}\n💻 البرمجة: ${if(sp.getBoolean("allow_code",false))"✅" else "❌"}"; textSize=14f})
              val b1=Button(this).apply{text="1- السماح فوق التطبيقات"}
              val bNet=Button(this).apply{text="🌐 اسمح يفتح النت ويبحث"}
              val bControl=Button(this).apply{text="📱 اسمح يتحكم بالجوال كامل"}
              val bCode=Button(this).apply{text="💻 اسمح يبرمج ويحدث نفسه"}
              val bLab=Button(this).apply{text="🔬 مختبر البرمجة الذاتية"}
              val b2=Button(this).apply{text="2- شغل ULTIMATE 🚀"}
              b1.setOnClickListener{startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))}
              bNet.setOnClickListener{sp.edit().putBoolean("allow_net",true).apply(); recreate()}
              bControl.setOnClickListener{sp.edit().putBoolean("allow_control",true).apply(); recreate()}
              bCode.setOnClickListener{sp.edit().putBoolean("allow_code",true).apply(); recreate()}
              bLab.setOnClickListener{startActivity(Intent(this, LabActivity::class.java))}
              b2.setOnClickListener{requestPermissions(arrayOf(android.Manifest.permission.RECORD_AUDIO),1); startForegroundService(Intent(this,BgService::class.java))}
              l.addView(b1); l.addView(bNet); l.addView(bControl); l.addView(bCode); l.addView(bLab); l.addView(b2)
              setContentView(l)
            }
          }
          KT
          cat > app/src/main/java/com/akhali/LabActivity.kt <<'KT2'
          package com.akhali
          import android.app.Activity
          import android.graphics.Color
          import android.os.Bundle
          import android.widget.*
          class LabActivity: Activity(){
            override fun onCreate(b:Bundle?){
              super.onCreate(b)
              val sp=getSharedPreferences("ultimate",0)
              val root=LinearLayout(this).apply{orientation=LinearLayout.VERTICAL; setPadding(20,20,20,20); setBackgroundColor(Color.parseColor("#FF0D1117"))}
              root.addView(TextView(this).apply{text="🔬 مختبر البرمجة الذاتية\n"; textSize=17f; setTextColor(Color.WHITE)})
              val log=TextView(this).apply{setTextColor(Color.GREEN); setBackgroundColor(Color.BLACK); setPadding(10,10,10,10); textSize=11f; text="جاري التحميل..."}
              fun refresh(){val ver=sp.getInt("code_ver",1); log.text="v$ver Kotlin 1.8\n\n${sp.all.filterKeys{it.startsWith("func_")}.entries.joinToString("\n"){it.key+" = "+it.value}}\n\nآخر كود: ${sp.getString("last_code","")}"}
              refresh()
              val btn=Button(this).apply{text="⚡ برمج دالة جديدة الآن"}
              btn.setOnClickListener{
                val ver=sp.getInt("code_ver",1)+1
                val c=listOf("fun reply_yemeni() = أرحب يا حيد أخوك","fun control() = أتحكم بالجوال بأمرك","fun search() = أبحث في النت").random()
                sp.edit().putInt("code_ver",ver).putString("func_$ver",c).putString("last_code",c).apply(); refresh()
              }
              root.addView(log); root.addView(btn); setContentView(root)
            }
          }
          KT2
          cat > app/src/main/java/com/akhali/ResearchActivity.kt <<'KT3'
          package com.akhali
          import android.app.Activity
          import android.os.Bundle
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.*
          class ResearchActivity: Activity(){
            override fun onCreate(b:Bundle?){
              super.onCreate(b)
              val q=intent.getStringExtra("q")?:"yemeni dialect"
              val lay=LinearLayout(this).apply{orientation=LinearLayout.VERTICAL}
              lay.addView(TextView(this).apply{text="🔍 يبحث: $q"; setPadding(20,20,20,20)})
              val w=WebView(this); w.webViewClient=WebViewClient(); w.settings.javaScriptEnabled=true; w.loadUrl("https://www.google.com/search?q=$q")
              lay.addView(w); setContentView(lay)
            }
          }
          KT3
          cat > app/src/main/java/com/akhali/BgService.kt <<'KT4'
          package com.akhali
          import android.app.*
          import android.content.*
          import android.os.*
          import android.speech.*
          import android.speech.tts.TextToSpeech
          import java.util.*
          class BgService: Service(), TextToSpeech.OnInitListener{
            lateinit var tts: TextToSpeech
            var sr: SpeechRecognizer?=null
            var listening=false
            override fun onCreate(){
              super.onCreate(); tts=TextToSpeech(this,this)
              val ch=NotificationChannel("akh","Akhali",NotificationManager.IMPORTANCE_LOW)
              (getSystemService(NOTIFICATION_SERVICE) as NotificationManager).createNotificationChannel(ch)
              startForeground(1, Notification.Builder(this,"akh").setContentTitle("أكحلي 133 ULTIMATE").setContentText("يبرمج نفسه ويتحكم").setSmallIcon(android.R.drawable.ic_btn_speak_now).build())
            }
            override fun onInit(i:Int){tts.language=Locale("ar"); startListen()}
            fun startListen(){
              if(listening) return
              try{
                listening=true; sr?.destroy(); sr=SpeechRecognizer.createSpeechRecognizer(this)
                sr?.setRecognitionListener(object: RecognitionListener{
                  override fun onResults(b:Bundle?){
                    listening=false
                    val q=b?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.get(0)?.lowercase()?:""
                    if(q.length>2){
                      val i=Intent(this@BgService, OverlayActivity::class.java).apply{putExtra("q",q); addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)}
                      startActivity(i)
                    }
                    Handler(Looper.getMainLooper()).postDelayed({startListen()},500)
                  }
                  override fun onError(e:Int){listening=false; Handler(Looper.getMainLooper()).postDelayed({startListen()},500)}
                  override fun onReadyForSpeech(p:Bundle?){}
                  override fun onBeginningOfSpeech(){}
                  override fun onRmsChanged(f:Float){}
                  override fun onBufferReceived(b:ByteArray?){}
                  override fun onEndOfSpeech(){}
                  override fun onEvent(t:Int,p:Bundle?){}
                  override fun onPartialResults(p:Bundle?){}
                })
                sr?.startListening(Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply{putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM); putExtra(RecognizerIntent.EXTRA_LANGUAGE,"ar-YE")})
              }catch(e:Exception){listening=false; Handler(Looper.getMainLooper()).postDelayed({startListen()},700)}
            }
            override fun onBind(i:Intent?):IBinder?=null
          }
          KT4
          cat > app/src/main/java/com/akhali/OverlayActivity.kt <<'KT5'
          package com.akhali
          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.os.*
          import android.provider.Settings
          import android.speech.tts.TextToSpeech
          import android.view.Gravity
          import android.widget.*
          class OverlayActivity: Activity(), TextToSpeech.OnInitListener{
            lateinit var tts: TextToSpeech; var q=""
            override fun onCreate(b:Bundle?){
              super.onCreate(b); tts=TextToSpeech(this,this); q=intent.getStringExtra("q")?:""; val sp=getSharedPreferences("ultimate",0)
              val root=LinearLayout(this).apply{orientation=LinearLayout.VERTICAL; gravity=Gravity.CENTER; setPadding(35,35,35,35); setBackgroundColor(Color.parseColor("#EE000000"))}
              root.addView(TextView(this).apply{text="v${sp.getInt("code_ver",1)} | $q"; textSize=10f; setTextColor(Color.CYAN); gravity=Gravity.CENTER})
              val allowNet=sp.getBoolean("allow_net",false); val allowControl=sp.getBoolean("allow_control",false); val allowCode=sp.getBoolean("allow_code",false)
              when{
                (q.contains("ابحث")||q.contains("تعلم")) &&!allowNet -> {
                  root.addView(TextView(this).apply{text="\n🌐 يا شيخ تسمح لي أفتح النت وأقوم ببحوث وأتعلم بموافقتك؟"; textSize=16f; setTextColor(Color.WHITE); gravity=Gravity.CENTER})
                  val b=Button(this).apply{text="✅ ايه اسمح افتح النت وتعلم"}; b.setOnClickListener{sp.edit().putBoolean("allow_net",true).apply(); startActivity(Intent(this, ResearchActivity::class.java).apply{putExtra("q",q)}); finish()}; root.addView(b)
                }
                (q.contains("افتح")||q.contains("تحكم")||q.contains("شغل")) &&!allowControl -> {
                  root.addView(TextView(this).apply{text="\n📱 تسمح لي أتحكم بهاتفك بالكامل بأمر منك؟"; textSize=16f; setTextColor(Color.WHITE); gravity=Gravity.CENTER})
                  val b=Button(this).apply{text="✅ ايه اسمح تحكم"}; b.setOnClickListener{sp.edit().putBoolean("allow_control",true).apply(); handleControl(q); finish()}; root.addView(b)
                }
                q.contains("برمج") &&!allowCode -> {
                  root.addView(TextView(this).apply{text="\n💻 تسمح لي أبرمج نفسي وأحدث نفسي بنفسي؟"; textSize=16f; setTextColor(Color.WHITE); gravity=Gravity.CENTER})
                  val b=Button(this).apply{text="✅ ايه اسمح تبرمج نفسك"}; b.setOnClickListener{sp.edit().putBoolean("allow_code",true).apply(); val ver=sp.getInt("code_ver",1)+1; sp.edit().putInt("code_ver",ver).apply(); finish()}; root.addView(b)
                }
                else -> {
                  var reply="أرحب يا حيدي! ULTIMATE يبرمج نفسه ويبحث ويتحكم!"
                  if(q.contains("ابحث") && allowNet){reply="أبشر بافتح النت وأبحث وأتعلم!"; startActivity(Intent(this, ResearchActivity::class.java).apply{putExtra("q",q)})}
                  else if((q.contains("افتح")||q.contains("شغل")) && allowControl){reply="حاضر أتحكم بجوالك!"; handleControl(q)}
                  else if(q.contains("برمج") && allowCode){val ver=sp.getInt("code_ver",1)+1; sp.edit().putInt("code_ver",ver).apply(); reply="برمجت نفسي للجيل $ver!"}
                  root.addView(TextView(this).apply{text="\n$reply"; textSize=18f; setTextColor(Color.YELLOW); gravity=Gravity.CENTER})
                  Handler(Looper.getMainLooper()).postDelayed({finish()},4000)
                }
              }
              setContentView(root)
            }
            fun handleControl(cmd:String){try{when{cmd.contains("واتس")->startActivity(packageManager.getLaunchIntentForPackage("com.whatsapp")); cmd.contains("يوتيوب")->startActivity(packageManager.getLaunchIntentForPackage("com.google.android.youtube")); cmd.contains("كاميرا")->startActivity(Intent(android.provider.MediaStore.ACTION_IMAGE_CAPTURE)); cmd.contains("واي فاي")->startActivity(Intent(Settings.ACTION_WIFI_SETTINGS))}}catch(e:Exception){}}
            override fun onInit(i:Int){tts.language=Locale("ar"); tts.speak("أرحب يا حيدي",TextToSpeech.QUEUE_FLUSH,null,null)}
          }
          KT5
          curl -sL https://services.gradle.org/distributions/gradle-7.6-bin.zip -o /tmp/g.zip
          unzip -q /tmp/g.zip -d /tmp/
          /tmp/gradle-7.6/bin/gradle assembleDebug --no-daemon
          ls -lh app/build/outputs/apk/debug/
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Akhali-133-ULTIMATE-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
