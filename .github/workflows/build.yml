name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix and Build
        run: |
          mkdir -p app/src/main/java/com/alakhaly/assistant
          mkdir -p app/src/main/res/layout
          mkdir -p gradle/wrapper
          mv *.kt app/src/main/java/com/alakhaly/assistant/ 2>/dev/null || true
          if [ -f AndroidManifest.xml ]; then mv AndroidManifest.xml app/src/main/; else
          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="AlAkhaly"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          fi
          [ -f activity_main.xml ] && mv activity_main.xml app/src/main/res/layout/ || echo '<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent"/>' > app/src/main/res/layout/activity_main.xml
          
          cat > build.gradle <<'E'
          buildscript{repositories{google();mavenCentral()}dependencies{classpath 'com.android.tools.build:gradle:8.1.4';classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.10'}}
          E
          echo "include ':app'" > settings.gradle
          cat > app/build.gradle <<'E'
          plugins{id 'com.android.application';id 'org.jetbrains.kotlin.android'}
          android{namespace 'com.alakhaly.assistant';compileSdk 34;defaultConfig{applicationId "com.alakhaly.assistant";minSdk 24;targetSdk 34;versionCode 1;versionName "1.0"};buildTypes{release{minifyEnabled false}}}
          dependencies{implementation 'androidx.core:core-ktx:1.12.0';implementation 'androidx.appcompat:appcompat:1.6.1'}
          E
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip" > gradle/wrapper/gradle-wrapper.properties
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlAkhali-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
