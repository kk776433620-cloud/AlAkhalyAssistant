name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Rebuild Project Structure
        run: |
          mkdir -p app/src/main/java/com/alakhaly/assistant
          mkdir -p app/src/main/res/layout
          mkdir -p gradle/wrapper
          mv *.kt app/src/main/java/com/alakhaly/assistant/ 2>/dev/null || true
          [ -f "AndroidManifest.xml" ] && mv AndroidManifest.xml app/src/main/ || true
          [ -f "activity_main.xml" ] && mv activity_main.xml app/src/main/res/layout/ || true
          
          # هذا هو الإصلاح للسطر 1
          cat > build.gradle << 'GRADLE'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.4'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.10'
              }
          }
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          GRADLE
          
          echo "include ':app'" > settings.gradle
          
          cat > app/build.gradle << 'APP'
          plugins {
              id '
