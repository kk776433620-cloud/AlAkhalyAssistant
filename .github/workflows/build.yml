              b1.setOnClickListener{ask("اسمح نت؟"){sp.edit().putBoolean("allow_net",true).apply()}}
              b2.setOnClickListener{ask("تحكم كامل؟"){startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))}}
              b3.setOnClickListener{if(Build.VERSION.SDK_INT>=23 &&!Settings.canDrawOverlays(this)){startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,Uri.parse("package:"+packageName)))}}
              b4.setOnClickListener{val i=Intent(this,BgService::class.java); if(Build.VERSION.SDK_INT>=26) startForegroundService(i) else startService(i)}
              b5.setOnClickListener{startActivity(Intent(this,LabActivity::class.java))}
              b6.setOnClickListener{startActivity(Intent(Intent.ACTION_VIEW,Uri.parse("https://www.google.com/search?q=الاكحلي")))}
              b7.setOnClickListener{val cm=getSystemService(CLIPBOARD_SERVICE) as ClipboardManager; cm.setPrimaryClip(ClipData.newPlainText("a","نسخ"))}
              b8.setOnClickListener{val dm=getSystemService(DOWNLOAD_SERVICE) as DownloadManager; val req=DownloadManager.Request(Uri.parse("https://github.com/AlAkhaly/AlAkhalyAssistant/releases/latest/download/app-debug.apk")); req.setTitle("تحديث"); req.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS,"alakhali.apk"); req.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED); dm.enqueue(req)}
