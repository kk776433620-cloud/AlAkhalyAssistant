          cat > app/src/main/java/com/akhali/SiriOrbView.kt << 'K1'
          package com.akhali
          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.*
          import android.view.View
          import kotlin.math.sin
          class SiriOrbView(c:Context):View(c){
            var t=0f
            var speaking=false
            var paint=Paint(Paint.ANTI_ALIAS_FLAG)
            var glow=Paint(Paint.ANTI_ALIAS_FLAG)
            init{
              glow.maskFilter=BlurMaskFilter(60f, BlurMaskFilter.Blur.NORMAL)
              ValueAnimator.ofFloat(0f,360f).apply{
                duration=4000
                repeatCount=ValueAnimator.INFINITE
                addUpdateListener{t=it.animatedValue as Float; invalidate()}
                start()
              }
            }
            fun startSpeaking(){speaking=true}
            fun stopSpeaking(){speaking=false}
            override fun onDraw(canvas:Canvas){
              super.onDraw(canvas)
              val cx=width/2f
              val cy=height/2f
              val baseR=if(speaking) 180f+40f*sin(Math.toRadians(t*4.0)).toFloat() else 150f+15f*sin(Math.toRadians(t.toDouble())).toFloat()
              for(i in 4 downTo 0){
                val r=baseR+i*35f
                glow.color=Color.argb(35-i*6,120+i*25,80+i*35,255)
                canvas.drawCircle(cx,cy,r,glow)
              }
              val colors=intArrayOf(Color.parseColor("#9C27B0"),Color.parseColor("#2196F3"),Color.parseColor("#E91E63"),Color.parseColor("#673AB7"),Color.parseColor("#00BCD4"),Color.parseColor("#9C27B0"))
              val shader=RadialGradient(cx,cy,baseR,colors,floatArrayOf(0f,0.2f,0.4f,0.6f,0.8f,1f),Shader.TileMode.CLAMP)
              paint.shader=shader
              canvas.drawCircle(cx,cy,baseR,paint)
              if(speaking){
                val wp=Paint(Paint.ANTI_ALIAS_FLAG)
                wp.style=Paint.Style.STROKE
                wp.strokeWidth=5f
                for(j in 0..4){
                  val wr=baseR+20f+j*28f+18f*sin(Math.toRadians((t*2.5+j*70).toDouble())).toFloat()
                  wp.color=Color.argb(80-j*12,150+j*20,100+j*30,255)
                  canvas.drawCircle(cx,cy,wr,wp)
                }
              }
              val white=Paint(Paint.ANTI_ALIAS_FLAG)
              white.color=Color.argb(140,255,255,255)
              canvas.drawCircle(cx-baseR*0.33f,cy-baseR*0.33f,baseR*0.24f,white)
            }
          }
          K1

          cat > app/src/main/java/com/akhali/SmartControlService.kt << 'K2'
          package com.akhali
          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import android.os.Build
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          class SmartControlService:AccessibilityService(){
            companion object{var instance:SmartControlService?=null}
            override fun onServiceConnected(){super.onServiceConnected(); instance=this}
            override fun onAccessibilityEvent(e:AccessibilityEvent?){}
            override fun onInterrupt(){}
            fun readScreen():String{
              val r=rootInActiveWindow?:return "لا يوجد شاشة فعل زر 2"
              var t=""
              fun rd(n:AccessibilityNodeInfo){
                if(n.text!=null) t+=n.text.toString()+" "
                if(n.contentDescription!=null) t+=n.contentDescription.toString()+" "
                for(i in 0 until n.childCount){
                  val c=n.getChild(i)
                  if(c!=null){rd(c); c.recycle()}
                }
              }
              rd(r)
              return if(t.isEmpty()) "شاشة فاضية" else t
            }
            fun clickAt(x:Float,y:Float){
              if(Build.VERSION.SDK_INT>=24){
                val p=Path(); p.moveTo(x,y)
                val g=GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(p,0,100)).build()
                dispatchGesture(g,null,null)
              }
            }
            fun swipeUp(){
              if(Build.VERSION.SDK_INT>=24){
                val p=Path(); p.moveTo(500f,1500f); p.lineTo(500f,300f)
                dispatchGesture(GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(p,0,400)).build(),null,null)
              }
            }
            fun swipeDown(){
              if(Build.VERSION.SDK_INT>=24){
                val p=Path(); p.moveTo(500f,300f); p.lineTo(500f,1500f)
                dispatchGesture(GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(p,0,400)).build(),null,null)
              }
            }
            fun swipeLeft(){
              if(Build.VERSION.SDK_INT>=24){
                val p=Path(); p.moveTo(800f,800f); p.lineTo(100f,800f)
                dispatchGesture(GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(p,0,400)).build(),null,null)
              }
            }
            fun doHome(){performGlobalAction(GLOBAL_ACTION_HOME)}
            fun doBack(){performGlobalAction(GLOBAL_ACTION_BACK)}
            fun doRecent(){performGlobalAction(GLOBAL_ACTION_RECENTS)}
            fun doNotification(){performGlobalAction(GLOBAL_ACTION_NOTIFICATIONS)}
            fun clickByText(text:String):Boolean{
              val root=rootInActiveWindow?:return false
              fun find(n:AccessibilityNodeInfo):AccessibilityNodeInfo?{
                if(n.text!=null && n.text.toString().contains(text,true)) return n
                for(i in 0 until n.childCount){
                  val c=n.getChild(i)
                  if(c!=null){val f=find(c); if(f!=null) return f; c.recycle()}
                }
                return null
              }
              val node=find(root)
              return if(node!=null){node.performAction(AccessibilityNodeInfo.ACTION_CLICK); true} else false
            }
            fun typeText(text:String):Boolean{
              val root=rootInActiveWindow?:return false
              fun findEdit(n:AccessibilityNodeInfo):AccessibilityNodeInfo?{
                if(n.className!=null && n.className.toString().contains("EditText")) return n
                for(i in 0 until n.childCount){
                  val c=n.getChild(i)
                  if(c!=null){val f=findEdit(c); if(f!=null) return f; c.recycle()}
                }
                return null
              }
              val edit=findEdit(root)
              return if(edit!=null){
                val b=android.os.Bundle()
                b.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE,text)
                edit.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT,b)
                true
              } else false
            }
          }
