name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          mkdir -p app/src/main/java/com/akhali
          mkdir -p gradle/wrapper
          echo "distributionUrl=https://services.gradle.org/distributions/gradle-7.6-bin.zip" > gradle/wrapper/gradle-wrapper.properties
          echo "include ':app'" > settings.gradle
          cat > build.gradle << 'END1'
          buildscript{ repositories{ google(); mavenCentral() }; dependencies{ classpath 'com.android.tools.build:gradle:7.4.2'; classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.20' } }
          allprojects{ repositories{ google(); mavenCentral() } }
          END1
          cat > app/build.gradle << 'END2'
          plugins{ id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android{ namespace 'com.akhali'; compileSdk 33; defaultConfig{ applicationId "com.akhali"; minSdk 21; targetSdk 33; versionCode 110; versionName "110-ALWAYS" }; compileOptions{ sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }; kotlinOptions{ jvmTarget='17' } }
          dependencies{ implementation 'androidx.core:core-ktx:1.10.1' }
          END2
          cat > app/src/main/AndroidManifest.xml << 'END3'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.akhali">
            <uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
            <application android:label="Akhali Always"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity><service android:name=".AkhaliService" android:exported="false" android:foregroundServiceType="microphone"/></application>
          </manifest>
          END3
          cat > app/src/main/java/com/akhali/MainActivity.kt << 'END5'
          package com.akhali
          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.speech.SpeechRecognizer
          import android.widget.*
          class MainActivity: Activity(){
            override fun onCreate(b:Bundle?){
              super.onCreate(b)
              val l=LinearLayout(this).apply{orientation=LinearLayout.VERTICAL; setPadding(30,30,30,30)}
              val tv=TextView(this).apply{text="أكحلي 110 - يسمع بدون ضغط\n\n1- اضغط الزر تحت مرة واحدة فقط\n2- بعدها اطفي الشاشة وخلي الجوال على الطاولة\n3- قول من بعيد: يا أكحلي\n4- بيرد عليك لحاله"; textSize=18f}
              val btn=Button(this).apply{text="شغل وضع الاستماع الدائم"}
              val btnCheck=Button(this).apply{text="افحص هل جوالي يدعم"}
              btnCheck.setOnClickListener{
                if(SpeechRecognizer.isRecognitionAvailable(this)) Toast.makeText(this,"يدعم ✅ اضغط زر التشغيل",Toast.LENGTH_LONG).show()
                else Toast.makeText(this,"لازم تنزل تطبيق Google من متجر التطبيقات",Toast.LENGTH_LONG).show()
              }
              btn.setOnClickListener{
                requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO, Manifest.permission.POST_NOTIFICATIONS),1)
                startForegroundService(Intent(this,AkhaliService::class.java))
                Toast.makeText(this,"اشتغل! الآن قول يا أكحلي بدون لمس الجوال",Toast.LENGTH_LONG).show()
              }
              l.addView(tv); l.addView(btnCheck); l.addView(btn); setContentView(l)
            }
          }
          END5
          cat > app/src/main/java/com/akhali/AkhaliService.kt << 'END4'
          package com.akhali
          import android.app.*
          import android.content.*
          import android.os.*
          import android.speech.*
          import android.speech.tts.TextToSpeech
          import java.util.*
          class AkhaliService: Service(), TextToSpeech.OnInitListener{
            lateinit var tts: TextToSpeech
            var sr: SpeechRecognizer?=null
            override fun onCreate(){
              super.onCreate()
              tts=TextToSpeech(this,this)
              val ch=NotificationChannel("akh","Akhali",NotificationManager.IMPORTANCE_LOW)
              (getSystemService(NOTIFICATION_SERVICE) as NotificationManager).createNotificationChannel(ch)
              startForeground(1, Notification.Builder(this,"akh").setContentTitle("أكحلي يسمعك بدون ضغط").setContentText("قل: يا أكحلي").setSmallIcon(android.R.drawable.ic_btn_speak_now).build())
            }
            override fun onInit(s:Int){ tts.language=Locale("ar"); startListening() }
            fun startListening(){
              try{
                sr?.destroy()
                sr=SpeechRecognizer.createSpeechRecognizer(this)
                sr?.setRecognitionListener(object: RecognitionListener{
                  override fun onResults(b:Bundle?){
                    val q=b?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.get(0)?.lowercase()?: ""
                    if(q.contains("اكحلي")||q.contains("akhali")){
                      var ans="نعم يا باشا؟"
                      if(q.contains("كيف حالك")) ans="الحمد لله بخير وانت؟"
                      else if(q.contains("كم الساعة")){ val c=Calendar.getInstance(); ans="الساعة ${c.get(Calendar.HOUR_OF_DAY)} و ${c.get(Calendar.MINUTE)}" }
                      else if(q.contains("سلام")) ans="وعليكم السلام"
                      tts.speak(ans,TextToSpeech.QUEUE_FLUSH,null,null)
                    }
                    Handler(Looper.getMainLooper()).postDelayed({startListening()},600)
                  }
                  override fun onError(e:Int){ Handler(Looper.getMainLooper()).postDelayed({startListening()},600) }
                  override fun onReadyForSpeech(p:Bundle?){}
                  override fun onBeginningOfSpeech(){}
                  override fun onRmsChanged(v:Float){}
                  override fun onBufferReceived(b:ByteArray?){}
                  override fun onEndOfSpeech(){}
                  override fun onEvent(t:Int,p:Bundle?){}
                  override fun onPartialResults(p:Bundle?){}
                })
                val i=Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply{
                  putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                  putExtra(RecognizerIntent.EXTRA_LANGUAGE, "ar-SA")
                  putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                }
                sr?.startListening(i)
              }catch(e:Exception){ Handler(Looper.getMainLooper()).postDelayed({startListening()},1000) }
            }
            override fun onBind(i:Intent?):IBinder?=null
            override fun onDestroy(){ sr?.destroy(); super.onDestroy() }
          }
          END4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 7.6
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Akhali-110-ALWAYS-LISTEN
          path: app/build/outputs/apk/debug/*.apk
